<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* تقويم مدار + الحجز */
.mc-wrap{display:flex;flex-direction:column;gap:16px;margin:16px 0}
.mc-nav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.mc-nav b{font-family:var(--f-display)}
.mc-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mc-h{text-align:center;font-size:.72rem;color:var(--muted);padding:2px 0}
.mc-c{min-height:58px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit}
.mc-c.off{border:0;background:transparent;cursor:default}
.mc-c.wkend{opacity:.55}
.mc-c.has{border-color:var(--accent-mid)}
.mc-c.today{outline:2px solid var(--accent);outline-offset:-2px}
.mc-c.sel{background:var(--accent-soft)}
.mc-n{font-size:.8rem;font-weight:600}
.mc-i{display:flex;flex-wrap:wrap;justify-content:center;gap:1px}
.mc-i i{font-style:normal;font-size:.8rem;line-height:1;padding:2px;border:1px solid;border-radius:6px}
.mc-i b{font-size:.65rem;color:var(--muted)}
.mc-leg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0 4px;font-size:.75rem;color:var(--muted)}
.mc-leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px}
.mc-st{font-family:var(--f-display);font-size:1rem;margin:14px 0 8px}
.mc-e{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:var(--sunk);border:0;border-inline-start:4px solid;border-radius:10px;padding:9px 10px;margin:0 0 6px;color:var(--ink);font:inherit;cursor:pointer}
.mc-ei{font-size:1.35rem}
.mc-eb{flex:1;display:flex;flex-direction:column;line-height:1.4}
.mc-eb small{color:var(--muted);font-size:.78rem}
.mc-add{background:var(--sunk);border-radius:12px;padding:12px;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.mc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc-add .field,.mc-add input,.mc-add select{width:100%}
.mc-smart{border-radius:12px;padding:10px 12px;margin:10px 0}
.mc-smart.warn{background:var(--warn-soft)} .mc-smart.good{background:var(--good-soft)}
.mc-smart p{margin:4px 0;color:inherit} .mc-smart ul{margin:4px 0;padding-inline-start:18px;color:inherit}
.mc-bub{display:flex;gap:8px;align-items:flex-start;background:rgba(127,127,127,.12);border-radius:14px;padding:9px 11px;margin:8px 0}
.mc-bub span{font-size:1.3rem} .mc-bub p{margin:0;color:inherit;font-size:.9rem}
.mc-rem{display:flex;flex-direction:column;gap:6px}
.mc-rem label{display:flex;gap:10px;align-items:center;background:rgba(127,127,127,.1);border-radius:10px;padding:8px 10px;cursor:pointer}
.mc-rem small{display:block;opacity:.75;font-size:.78rem}
.bk-who{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.bk-p{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;color:var(--ink);font:inherit;cursor:pointer;text-align:center}
.bk-p span{font-size:1.5rem} .bk-p b{font-size:.82rem} .bk-p small{font-size:.68rem;color:var(--muted)}
.bk-p.on,.bk-d.on,.bk-s.on{border-color:var(--accent);background:var(--accent-soft)}
.bk-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.bk-d{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--ink);font:inherit;cursor:pointer}
.bk-d small{font-size:.7rem;color:var(--good)} .bk-d:disabled{opacity:.4}
.bk-slots{display:flex;flex-wrap:wrap;gap:6px}
.bk-s{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink);font:inherit;cursor:pointer}
.bk-s:disabled{opacity:.35;text-decoration:line-through}
@media (max-width:620px){.mc-c{min-height:48px}.bk-who{grid-template-columns:repeat(2,1fr)}.mc-i i{font-size:.7rem}}
</style></head><body>
<title>مَدار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* التخطيط: شريط علوي ثابت للأدوار، وتحته لوحة الدور في أعمدة تتكدّس على الجوال، وبطاقة جولة عائمة أسفل الشاشة */
:root{
  --bg:#FAF6F5; --surface:#FFFFFF; --sunk:#F3ECEA; --ink:#2A1B18; --muted:#6E5A56; --line:#EADCD9;
  --accent:#C64C39; --accent-ink:#8B3428; --accent-soft:#FFD7D2; --accent-mid:#FFAFA4;
  --good:#2F7D5B; --good-soft:#DDF0E6; --warn:#A8670F; --warn-soft:#FBEBCF; --crit:#A61E3A; --crit-soft:#F8D9DF;
  --none:#8C7D7A; --none-soft:#EEE7E5;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1312; --surface:#241A19; --sunk:#2D2120; --ink:#F5E9E6; --muted:#BFA9A4; --line:#3D2D2B;
  --accent:#FF8F7E; --accent-ink:#FFB3A8; --accent-soft:#4A2723; --accent-mid:#7A3B33;
  --good:#6BCB9C; --good-soft:#1E3A2D; --warn:#F0B95A; --warn-soft:#3D2E14; --crit:#FF8FA3; --crit-soft:#47202A;
  --none:#A8968F; --none-soft:#332826; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1A1312; --surface:#241A19; --sunk:#2D2120; --ink:#F5E9E6; --muted:#BFA9A4; --line:#3D2D2B;
  --accent:#FF8F7E; --accent-ink:#FFB3A8; --accent-soft:#4A2723; --accent-mid:#7A3B33;
  --good:#6BCB9C; --good-soft:#1E3A2D; --warn:#F0B95A; --warn-soft:#3D2E14; --crit:#FF8FA3; --crit-soft:#47202A;
  --none:#A8968F; --none-soft:#332826; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
#app{min-height:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* الشريط العلوي */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none}
.brand h1{font-size:1.1rem}
.brand .sub{font-size:.78rem;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.demo{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.live{background:var(--good-soft);color:var(--good);border-color:transparent}
.badge.ai{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.spacer{flex:1}
.roles{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%}
.roles button{border:0;background:none;padding:6px 14px;border-radius:999px;white-space:nowrap;color:var(--muted);font-weight:500}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#2A1B18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#2A1B18}}
.btn.ghost{border-color:transparent;background:none;color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}

/* الصفحة */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:stretch}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.lead h2{font-size:1.35rem}
.lead .flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.lead .flow b{color:var(--ink);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.panel-h h2{font-size:1.02rem}
.panel-h .spacer{flex:1}
.eyebrow{font-size:.75rem;letter-spacing:.02em;color:var(--accent-ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
select,input[type=number],input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);min-width:0}
textarea{width:100%;resize:vertical;min-height:70px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-weight:600;color:var(--muted);font-size:.78rem;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}

/* المؤشرات */
.lv{display:inline-flex;gap:4px;flex-wrap:nowrap}
.lv button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 9px;font-size:.8rem;white-space:nowrap}
.lv button.good:hover,.lv button.good[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.lv button.warn:hover,.lv button.warn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.lv button.crit:hover,.lv button.crit[aria-pressed="true"]{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.lv button.none:hover,.lv button.none[aria-pressed="true"]{background:var(--none-soft);border-color:var(--none);color:var(--none)}
.dots{display:inline-flex;gap:4px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}.dot.none{background:var(--none-soft);border:1px solid var(--none)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.none{background:var(--none-soft);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* التنبيهات */
.alert{border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.alert.crit{border-inline-start-color:var(--crit)}
.alert .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.alert ul{margin:0;padding-inline-start:18px;font-size:.85rem;color:var(--muted)}
.ai-out{background:var(--sunk);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.ai-out ol,.ai-out ul{margin:0;padding-inline-start:20px}
.ai-tag{font-size:.72rem;color:var(--accent-ink);font-weight:600;display:flex;align-items:center;gap:6px}

/* خطة الطالبة */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:none;margin-top:2px;display:grid;place-items:center;padding:0}
.task.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{font-weight:600}
.t-why{font-size:.83rem;color:var(--muted)}
.t-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.t-act{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cal{font-size:.8rem;color:var(--accent-ink);text-decoration:none;border-bottom:1px dashed currentColor}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.88rem}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.trend.up{color:var(--good)}.trend.down{color:var(--crit)}.trend.flat{color:var(--muted)}

/* المحادثة */
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:.9rem;white-space:pre-wrap}
.msg.me{align-self:flex-start;background:var(--accent-soft);color:var(--ink)}
.msg.bot{align-self:flex-end;background:var(--sunk)}
.chat-in{display:flex;gap:8px}
.chat-in input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.8rem}

/* الإدارة */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:600}
.kpi span{font-size:.8rem;color:var(--muted)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk);min-width:120px}
.stack i{display:block;height:100%}
.stack .good{background:var(--good)}.stack .warn{background:var(--warn)}.stack .crit{background:var(--crit)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* المسارات */
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.path{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.path h3{font-size:.98rem}
.path dl{margin:0;display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.path dt{color:var(--muted);font-size:.75rem}
.path dd{margin:0}
.dim{display:grid;grid-template-columns:7.5em 1fr;gap:8px;align-items:center;font-size:.85rem}
.pips{display:flex;gap:3px}
.pips i{width:18px;height:8px;border-radius:3px;background:var(--sunk)}
.pips i.on{background:var(--accent)}
.note{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.84rem;color:var(--muted)}
.method{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:.84rem}
.method ol{margin:6px 0 0;padding-inline-start:20px}

/* الجولة */
.tour{position:fixed;z-index:40;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:max(16px,env(safe-area-inset-left,0px));max-width:560px;margin-inline:auto;background:var(--surface);border:1px solid var(--accent-mid);border-radius:14px;box-shadow:0 10px 30px rgba(60,20,15,.18);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tour .step{font-size:.75rem;color:var(--accent-ink);font-weight:600}
.tour h3{font-size:1rem}
.tour p{font-size:.9rem;color:var(--muted)}
.tour .row{justify-content:space-between}
.spot{outline:3px solid var(--accent);outline-offset:4px;border-radius:10px;transition:outline-color .3s}
.toast{position:fixed;z-index:50;top:calc(70px + env(safe-area-inset-top,0px));inset-inline:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.88rem}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:.88rem;border:1px dashed var(--line);border-radius:8px}
hr{border:0;border-top:1px solid var(--line);margin:0}

/* واجهة الطالبة — ألطف */
.kid{--k-bg1:#FFE9E5;--k-bg2:#FFF4E8;--k-card:#FFFFFF;--k-ring:#FBE1DC;--k-t1:#FFE7E2;--k-t2:#E7F3FF;--k-t3:#F1EAFF;--k-t4:#E4F6EC;display:flex;flex-direction:column;gap:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kid{--k-bg1:#3A2220;--k-bg2:#2E2418;--k-card:#241A19;--k-ring:#3D2A28;--k-t1:#3A2421;--k-t2:#1E2B3A;--k-t3:#2A2238;--k-t4:#1C3127}}
:root[data-theme="dark"] .kid{--k-bg1:#3A2220;--k-bg2:#2E2418;--k-card:#241A19;--k-ring:#3D2A28;--k-t1:#3A2421;--k-t2:#1E2B3A;--k-t3:#2A2238;--k-t4:#1C3127}
.kid .kcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.k-hero{background:linear-gradient(135deg,var(--k-bg1),var(--k-bg2));border-radius:24px;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.k-av{width:64px;height:64px;border-radius:50%;background:var(--k-card);display:grid;place-items:center;font-size:2.1rem;box-shadow:0 4px 14px rgba(198,76,57,.15);flex:none}
.k-hi{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.k-hi h2{font-size:1.4rem}
.k-hi p{color:var(--muted)}
.k-stats{display:flex;gap:8px;flex-wrap:wrap}
.k-stats span{background:var(--k-card);border-radius:999px;padding:3px 12px;font-size:.88rem}
.ring{width:72px;height:72px;flex:none}
.k-pick{flex-basis:100%;display:flex;justify-content:flex-end}
.k-card{background:var(--k-card);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(139,52,40,.06);min-width:0}
.k-card.t3{background:var(--k-t3)}
.k-h{display:flex;align-items:center;gap:8px}
.k-h h3{font-size:1.05rem}
.k-sub{font-size:.8rem;color:var(--muted)}
.k-note{font-size:.8rem;color:var(--muted)}

function scoredAssess(sid,subj,onlyOfficial){
  return S.assessments.filter(a=>a.subj===subj && (!onlyOfficial || a.status!=='draft')).sort((x,y)=>x.week-y.week)
    .map(a=>({a, g:a.grades[sid]})).filter(x=>x.g && x.g.s==='ok').map(x=>({title:x.a.title, week:x.a.week, r:x.g.v/x.a.max, v:x.g.v, max:x.a.max}));
}
function alerts(filter){
  const out=[];
  S.students.forEach(st=>{
    Object.keys(S.subjects).forEach(subj=>{
      if(filter && filter.subj && filter.subj!==subj) return;
      S.subjects[subj].skills.forEach(skill=>{
        const l=S.indicators.filter(i=>i.sid===st.id&&i.subj===subj&&i.skill===skill).sort((a,b)=>a.week-b.week||a.period-b.period).slice(-3);
        const bad=l.filter(i=>i.level==='p'||i.level==='h');
        if(bad.length>=2) out.push({key:st.id+'|'+subj+'|skill|'+skill, sid:st.id, subj, skill, sev:bad.some(i=>i.level==='h')?'crit':'warn',
          reason:'تكرار التعثّر في مهارة «'+skill+'»',
          ev:l.map(i=>'الأسبوع '+i.week+'، الحصة '+i.period+': '+LV[i.level].t),
          action:'خطة دعم قصيرة في '+skill+' ومتابعة في الحصة القادمة', owner:S.subjects[subj].teacher, review:'الأسبوع '+(S.week+1)});
      });
      const sc=scoredAssess(st.id,subj,true);
      if(sc.length>=2){const [p,c]=sc.slice(-2); if(c.r<p.r-0.15) out.push({key:st.id+'|'+subj+'|drop', sid:st.id, subj, sev:'warn',
        reason:'تراجع بين تقييمين متكافئين', ev:[p.title+': '+fmt(p.v)+' من '+p.max, c.title+': '+fmt(c.v)+' من '+c.max],
        action:'مراجعة نوع الأخطاء مع الطالبة وتحديد المهارة', owner:S.subjects[subj].teacher, review:'الأسبوع '+(S.week+1)});}
    });
    if(!filter || !filter.subj || filter.general){
      if(st.hw>=2) out.push({key:st.id+'|hw', sid:st.id, subj:null, sev:'warn', reason:'تكرار عدم تسليم الواجبات', ev:['عدد الواجبات غير المسلّمة هذا الفصل: '+st.hw], action:'تواصل مع ولي الأمر وتنظيم وقت الواجبات في خطة بوصلة', owner:'المعلمة + ولي الأمر', review:'الأسبوع '+(S.week+1)});
      if(st.abs>=3) out.push({key:st.id+'|abs', sid:st.id, subj:null, sev:'warn', reason:'غياب مسجّل قد يؤثر على متابعة الدروس', ev:['أيام الغياب المسجّلة رسميًا: '+st.abs], action:'تزويدها بملخص الدروس الفائتة وإحالة لبوصلة', owner:'بوصلة', review:'الأسبوع '+(S.week+1)});
    }
  });
  return out;
}

async function gem(kind,payload){
  if(S.gemini==='live' && IS_GAS){
    try{ const r=await call('askGemini',kind,payload); if(r && r.ok) return {live:true, text:r.text}; }catch(e){}
  }
  return {live:false, text:simGem(kind,payload)};
}
function simGem(kind,p){
  if(kind==='plan'){
    return JSON.stringify([
      {title:'فيديو مراجعة قصير: '+p.skill, min:10, why:'آخر مؤشرين في «'+p.skill+'» أقل من الإتقان، والفيديو يرجّعها للأساس.'},
      {title:'خمسة أسئلة تدريب على '+p.skill, min:20, why:'نتأكد إن الفهم ثبت، والنتيجة ترجع للمعلمة.', kind:'practice'},
      {title:'سؤال المعلمة عن أصعب خطوة في الحصة القادمة', min:5, why:'إذا تكرر التعثّر، الشرح المباشر أسرع.', kind:'ask'}
    ]);
  }
  if(kind==='parent'){
    const d=p.done, need=p.need;
    return 'أنجزت ابنتكم '+d+' '+(d===1?'مهمة':'مهام')+' من خطتها هذا الأسبوع.'+(need?' ما زالت تحتاج دعمًا في «'+need+'»، وخُصّص لها تدريب قصير ضمن خطتها.':' أداؤها مستقر في المهارات الحالية.')+
      (p.practice?' نتيجة آخر تدريب: '+p.practice+'.':'')+' يمكنكم مساعدتها بتوفير وقت هادئ للدراسة وتشجيعها على سؤال المعلمة.';
  }
  if(kind==='admin'){
    return 'أكثر مهارة تكرر فيها التعثّر هذا الفصل: «'+p.topSkill+'» ('+p.topCount+' ملاحظات بحاجة تدريب أو مساعدة). يقترح التحليل حصة مراجعة مشتركة لهذه المهارة، ومتابعة '+p.alertCount+' طالبات لديهن تنبيه «تحتاج متابعة».';
  }
  if(kind==='coach'){
    const q=(p.q||'').trim();
    if(/اشرح|حل|ما فهمت|مافهمت|سؤال/.test(q)) return 'الشرح عند مساعد المادة 🤍 أنا أنظّم وقتج. حطيت لج «اسألي مساعد الكيمياء» ضمن خطة اليوم، وإذا ما وضح، اسألي المعلمة بالحصة.';
    if(/فات|ما خلصت|ماخلصت|تأخرت|ما قدرت/.test(q)) return 'عادي يصير 👍 نقلت المهام اللي فاتتج لباجر وقسمتها على وقتين قصيرين، بدون ما نكدّسها. شوفي خطتج.';
    if(/اختبار|قصير|امتحان/.test(q)) return 'عندج '+p.next+'. حطيت لج مراجعة 20 دقيقة قبلها بيومين، ومراجعة سريعة 10 دقايق الليلة اللي قبل. يناسبج الساعة 5؟';
    if(/تعب|ضغط|كثير/.test(q)) return 'خففنا خطة اليوم لمهمتين بس، والباقي توزع على الأسبوع. استراحة 10 دقايق بين كل مهمة.';
    return 'وضعج: '+p.summary+' أقوى شي عندج '+p.strong+'. تبين أرتب لج خطة الأسبوع؟';
  }
  if(kind==='talent'){
    const d=(p.domains||[]).join(' و')||'مجالها';
    return p.who==='student'?'خطتج لهالشهر 🌟 أسبوع ١: اختاري سؤال يحيّرج في '+d+' ودوّري عليه. أسبوع ٢: سوي تجربة أو تصميم صغير وصوّريه. أسبوع ٣: اعرضيه على معلمتج. أسبوع ٤: سجّلي بمسابقة أو نشاط بالمدرسة.':
      'نقترح لهالشهر: ساعة بالأسبوع لنشاط في '+d+' تختاره هي، وتشجيعها تعرض شغلها على المعلمة، والتواصل مع بوصلة عن خطوة الفحص الرسمي. الأهم: نمدح الجهد مو بس النتيجة.';
  }
  if(kind==='counsel'){
    return 'الميول البارزة: '+p.top+'. الأداء الأقوى في: '+p.strong+'. أنسب ثلاثة مسارات حسب القواعد المعلنة معروضة بالأسفل، وتحتاج مناقشة مع الطالبة وولي الأمر قبل تحديد الهدف.';
  }
  return '';
}

async function suggestPlan(key){

function approvePlan(key){

function toggleTask(id,result){
  const t=S.plans.find(x=>x.id===id); if(!t) return;

    finishPractice({sid:t.sid,subj:t.subj,skill:taskSkill(t),game:'تقييم ذاتي',score:result,total:5,items:[],mistakes:[],sec:0,at:new Date().toISOString()},t.id); return;

function calLink(t){
  const d=new Date(); const diff=(t.day-d.getDay()+7)%7; d.setDate(d.getDate()+diff);
  const [hh,mm]=t.time.split(':').map(Number); d.setHours(hh,mm,0,0); const e=new Date(d.getTime()+t.min*60000);
  const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&details='+encodeURIComponent(t.why+'\n— من خطة بوصلة في '+CONFIG.appName)+'&dates='+f(d)+'/'+f(e)+'&ctz=Asia/Kuwait';
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function memOf(sid){const m={};(S.practice||[]).filter(p=>p.sid===sid).forEach(p=>(p.items||[]).forEach(it=>{const x=m[it.k]=m[it.k]||{w:0,r:0};it.ok?x.r++:x.w++;}));return m;}
function pickItems(sid,skill){
  const mem=memOf(sid), bank=BANK[skill];
  const weak=shuffle(bank.filter(i=>mem[i.k]&&mem[i.k].w>mem[i.k].r));
  const fresh=shuffle(bank.filter(i=>!mem[i.k]));
  const rest=shuffle(bank.filter(i=>mem[i.k]&&!(mem[i.k].w>mem[i.k].r)));
  let out=weak.concat(fresh,rest).slice(0,5).map(i=>({skill,it:i}));
  // مراجعة متباعدة: سؤال من مهارة سابقة غلطت فيها يرجع هنا
  const back=ORDER_SK.filter(s=>s!==skill).flatMap(s=>BANK[s].filter(i=>mem[i.k]&&mem[i.k].w>mem[i.k].r).map(i=>({skill:s,it:i,review:true})));
  if(back.length) out[4]=shuffle(back)[0];
  return out;
}
function skillStars(sid,skill){const b=Math.max(-1,...(S.practice||[]).filter(p=>p.sid===sid&&p.skill===skill&&p.game!=='تقييم ذاتي').map(p=>p.score));return b>=5?3:b>=4?2:b>=3?1:0;}
function totalStars(sid){return ORDER_SK.reduce((n,s)=>n+skillStars(sid,s),0);}
function taskSkill(t){return t.skill||(t.title.split('على ')[1]||'').trim();}

let G=null;
function openGame(sid,skill,taskId){
  if(!GAMES[skill]) return;
  G={sid,skill,taskId,items:pickItems(sid,skill),i:0,score:0,res:[],mist:[],start:Date.now(),fb:null,sel:[],box:null};

}
function prepQ(){const q=G.items[G.i]; G.fb=null; G.sel=[]; G.opts=null;
  const ty=GAMES[q.skill].type;
  if(ty==='bubble') G.opts=shuffle([q.it.a].concat(q.it.d));
  if(ty==='order') G.opts=shuffle(q.it.seq);
  if(ty==='orbit') G.box=Array(q.it.b).fill(0);
  if(ty==='home'){const {p,g}=q.it; const alt=g===1?2:g===2?1:g===18?17:g+1; const c=[[p,g],[p===2?3:p-1,g],[p,alt],[p+1,g===1?2:g-1]]; G.opts=shuffle(c.map(x=>x.join('|')));}
}
function answer(ok,shown){
  const q=G.items[G.i]; G.res.push({k:q.it.k,ok}); if(ok) G.score++; else if(q.it.m) G.mist.push(q.it.m);
  G.fb={ok,why:q.it.why,shown}; renderGame();
}
function nextQ(){
  if(G.i<G.items.length-1){G.i++; prepQ(); renderGame(); return;}
  const before=totalStars(G.sid);
  const rec={sid:G.sid,subj:'chem',skill:G.skill,game:GAMES[G.skill].name,score:G.score,total:G.items.length,items:G.res,mistakes:G.mist,sec:Math.round((Date.now()-G.start)/1000),at:new Date().toISOString()};
  finishPractice(rec,G.taskId);
  G.done={stars:skillStars(G.sid,G.skill),gained:totalStars(G.sid)-before}; renderGame();
}
function closeGame(){G=null; $('#game').hidden=true; document.body.style.overflow=''; render();}
function finishPractice(rec,taskId){
  (S.practice=S.practice||[]).push(rec); live('savePractice',rec);
  const lvl=rec.score>=4?'m':rec.score>=3?'p':'h';
  S.indicators.push({sid:rec.sid,subj:rec.subj,skill:rec.skill,level:lvl,week:S.week,period:4,by:rec.game==='تقييم ذاتي'?'تدريب بوصلة':'لعبة التدريب'});
  const sup=(S.supports||[]).find(s=>s.sid===rec.sid&&s.skill===rec.skill); if(sup){sup.status=lvl==='m'?'تحسّن':'مستمرة'; sup.result=rec.score+' من '+rec.total;}
  const t=taskId&&S.plans.find(x=>x.id===taskId);

}
function buildingSVG(floors,max){
  max=max||6; const fw=120, fh=22, x0=40, base=170; let s='';
  for(let i=0;i<max;i++){const y=base-(i+1)*fh, on=i<floors;
    s+='<rect x="'+x0+'" y="'+y+'" width="'+fw+'" height="'+(fh-2)+'" rx="3" fill="'+(on?'var(--accent)':'none')+'" fill-opacity="'+(on?0.18+i*0.1:1)+'" stroke="'+(on?'var(--accent)':'var(--line)')+'" stroke-dasharray="'+(on?'0':'4 4')+'"/>';
    if(on) for(let w=0;w<4;w++) s+='<rect x="'+(x0+12+w*27)+'" y="'+(y+6)+'" width="14" height="8" rx="1.5" fill="var(--surface)"/>';}
  if(floors<max){const ty=base-max*fh-12; s+='<path d="M175 '+(base)+' V'+ty+' H70 M175 '+ty+' l-14 0 M95 '+ty+' v18" stroke="var(--warn)" stroke-width="2.5" fill="none"/><rect x="88" y="'+(ty+18)+'" width="14" height="8" fill="var(--warn)"/>';}
  return '<svg viewBox="0 0 200 180" role="img" aria-label="عمارة الإلكترونات: '+floors+' من '+max+' أدوار" style="width:100%;max-width:220px;height:auto"><line x1="20" y1="'+base+'" x2="190" y2="'+base+'" stroke="var(--muted)" stroke-width="2"/>'+s+'</svg>';
}
function renderGame(){

    el.innerHTML='<div class="g-card" role="dialog" aria-label="نتيجة التدريب"><div class="g-top"><b>'+esc(GAMES[G.skill].name)+'</b><span class="spacer"></span><button class="btn sm ghost" data-act="g-close">إغلاق</button></div>'+

      buildingSVG(fl)+'<p class="small muted">عمارتج: '+fl+' من 6 أدوار'+(G.done.gained>0?' · +'+G.done.gained+' نجوم':'')+'</p>'+

      '<button class="btn primary" data-act="g-close">رجوع لخطتي</button></div></div>';
    return;}
  const q=G.items[G.i], ty=GAMES[q.skill].type, it=q.it;
  let body='';
  if(ty==='bubble'){body='<p class="g-q">اختاري التوزيع الصحيح لـ <b>'+esc(it.q)+'</b></p><div class="bubbles">'+G.opts.map((o,i)=>'<button class="bub" style="animation-delay:'+(i*0.4)+'s" data-act="g-bub" data-v="'+esc(o)+'"'+(G.fb?' disabled':'')+' dir="ltr">'+esc(o)+'</button>').join('')+'</div>';}
  if(ty==='order'){body='<p class="g-q">رتّبي الطوابق من الأقل طاقة للأعلى (اضغطي بالترتيب)</p><div class="slots" dir="ltr">'+it.seq.map((_,i)=>'<span class="slot">'+(G.sel[i]||'')+'</span>').join('<span class="arr">→</span>')+'</div><div class="row" style="justify-content:center">'+G.opts.map(o=>'<button class="chip big" data-act="g-ord" data-v="'+o+'"'+(G.sel.includes(o)||G.fb?' disabled':'')+'>'+o+'</button>').join('')+'</div>'+(G.sel.length&&!G.fb?'<div class="row" style="justify-content:center"><button class="btn sm ghost" data-act="g-ordreset">من جديد</button></div>':'');}

  el.innerHTML='<div class="g-card" role="dialog" aria-label="'+esc(GAMES[G.skill].name)+'"><div class="g-top"><div><b>'+esc(GAMES[q.skill].name)+'</b>'+(q.review?' <span class="pill warn">مراجعة: '+esc(q.skill)+'</span>':'')+'<div class="small muted">'+esc(GAMES[q.skill].goal)+'</div></div><span class="spacer"></span><span class="g-dots">'+G.items.map((_,i)=>'<i class="'+(i<G.res.length?(G.res[i].ok?'good':'crit'):i===G.i?'cur':'')+'"></i>').join('')+'</span><button class="btn sm ghost" data-act="g-close" aria-label="إغلاق">✕</button></div>'+body+fb+'</div>';

function gameClick(a,b){
  const q=G.items[G.i], it=q.it;
  if(a==='g-bub') answer(b.dataset.v===it.a, b.dataset.v===it.a?'':'الصحيح: '+it.a);
  else if(a==='g-ord'){G.sel.push(b.dataset.v); if(G.sel.length===it.seq.length){const ok=G.sel.every((x,i)=>x===it.seq[i]); answer(ok, ok?'':'الصحيح: '+it.seq.join(' ← '));} else renderGame();}
  else if(a==='g-ordreset'){G.sel=[]; renderGame();}
  else if(a==='g-orb'){const i=+b.dataset.i; G.box[i]=(G.box[i]+1)%3; renderGame();}
  else if(a==='g-check'){const tot=G.box.reduce((x,y)=>x+y,0), pairs=G.box.filter(v=>v===2).length, need=Math.max(0,it.n-it.b);
    const ok=tot===it.n && pairs===need; answer(ok, ok?'':(tot!==it.n?'العدد لازم يكون '+it.n:'الأفلاك المزدوجة لازم تكون '+need));}
  else if(a==='g-home'){const ok=b.dataset.v===it.p+'|'+it.g; answer(ok, ok?'':'الصحيح: الدورة '+it.p+' · المجموعة '+it.g);}
  else if(a==='g-next') nextQ();
  else if(a==='g-close') closeGame();
}

function noms(sid){return (S.nominations||[]).filter(n=>n.sid===sid);}
function talent(sid){
  const st=stu(sid); if(!st) return {score:0,level:null,dom:[],ev:[]};
  const ev=[], add=(d,t,w)=>ev.push({d,t,w});
  const tv=Object.values(st.term||{}).filter(v=>v!=null);
  if(tv.length>=4){const avg=tv.reduce((a,b)=>a+b,0)/tv.length; if(avg>=90) add('acad','معدل عالي ('+fmt(avg)+')',1);}
  Object.keys(st.term||{}).forEach(k=>{if(st.term[k]>=95) add(TAL_SUBJ[k]||'acad',TERM[k]+' '+st.term[k],1);});
  const pr=(S.practice||[]).filter(p=>p.sid===sid&&p.game!=='تقييم ذاتي'), full=pr.filter(p=>p.score===p.total);
  if(full.length>=2){const sec=Math.round(full.reduce((a,p)=>a+(p.sec||0),0)/full.length); if(sec&&sec<=240) add('sci','دقة وسرعة بالتدريب ('+full.length+' ألعاب كاملة، متوسط '+Math.round(sec/60*10)/10+' د)',1);}
  if(st.interests) Object.keys(st.interests).forEach(k=>{if(st.interests[k]>=5&&TAL_DIM[k]) add(TAL_DIM[k],'ميل قوي: '+DIMS[k],0.5);});
  if(/أولمبياد|مسابقة/.test(st.goal||'')) add('sci','هدفها: '+st.goal,0.5);
  ev.forEach(e=>e.src='data');
  let selfW=0;
  noms(sid).forEach(n=>{if(n.role==='teacher'){add(n.domain,'ترشيح '+n.by+(n.traits&&n.traits.length?': '+n.traits.join('، '):''),1.5); ev[ev.length-1].src='teacher';}
    else if(n.role==='parent'){add(n.domain,'ترشيح ولي الأمر: '+(n.note||TAL[n.domain].n),1); ev[ev.length-1].src='parent';}
    else if(n.role==='self'){const w=selfW<1?0.5:0; selfW+=0.5; add(n.domain,'نجمة من '+st.name+': '+(n.note||TAL[n.domain].n),w); Object.assign(ev[ev.length-1],{src:'self',link:n.link||''});}});
  const score=ev.reduce((a,e)=>a+e.w,0), dm={}, srcs={}; ev.forEach(e=>{dm[e.d]=(dm[e.d]||0)+(e.w||0.25); (srcs[e.d]=srcs[e.d]||new Set()).add(e.src);});
  const lit=Object.keys(srcs).filter(d=>d!=='acad'&&srcs[d].size>=3);
  const dom=(lit.length?lit:[]).concat(Object.keys(dm).sort((a,b)=>dm[b]-dm[a]).filter(d=>!lit.includes(d)&&(d!=='acad'||Object.keys(dm).length===1))).slice(0,2);
  const referred=noms(sid).some(n=>n.status==='referred');
  return {score,level:(score>=3||lit.length)?'cand':score>=2?'prom':null,dom,ev,referred,srcs,lit};
}

const SKYPOS={sci:[70,62],math:[170,48],tech:[270,64],art:[80,150],lead:[180,138],lang:[280,150],social:[130,100],acad:[230,104]};
function skySVG(t,small){
  const by={}; t.ev.forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
  const W=340,H=190; let g='';
  for(let i=0;i<40;i++){const x=(i*73)%W, y=(i*41+i*i)%H; g+='<circle cx="'+x+'" cy="'+y+'" r="'+(i%3?0.6:1)+'" fill="#fff" opacity="'+(0.25+(i%4)*0.12)+'"/>';}
  Object.keys(by).forEach(d=>{const [cx,cy]=SKYPOS[d]||[170,95], list=by[d], on=(t.lit||[]).includes(d);
    const n=list.length, R=n<2?0:Math.min(26,10+n*2.5);
    const pts=list.map((e,i)=>{const a=-Math.PI/2+i*2*Math.PI/n, r=R*(i%2?0.72:1); return [cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.75, e];});
    if(n>1) g+='<'+(n>2?'polygon':'polyline')+' points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="'+(on?'#FFD166':'none')+'" fill-opacity="'+(on?0.08:0)+'" stroke="'+(on?'#FFD166':'#ffffff')+'" stroke-opacity="'+(on?0.9:0.35)+'" stroke-width="'+(on?1.4:1)+'" stroke-dasharray="'+(on?'0':'3 3')+'"/>';
    if(on) g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+16)+'" fill="url(#glow)"/>';
    pts.forEach(p=>{const c=SRC[p[2].src].c; g+='<g><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(on?5:4)+'" fill="'+c+'"><title>'+esc(SRC[p[2].src].n+' · '+p[2].t)+'</title></circle><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="8" fill="'+c+'" opacity=".18"/></g>';});
    if(!small) g+='<text x="'+cx+'" y="'+(cy+R*0.75+16).toFixed(1)+'" text-anchor="middle" font-size="10" fill="#fff" opacity="'+(on?1:0.7)+'">'+TAL[d].i+' '+TAL[d].n+(on?' ✨':'')+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;border-radius:14px;background:radial-gradient(ellipse at 30% 20%,#2B2350,#120E24)" role="img" aria-label="كوكبة التميّز"><defs><radialGradient id="glow"><stop offset="0" stop-color="#FFD166" stop-opacity=".45"/><stop offset="1" stop-color="#FFD166" stop-opacity="0"/></radialGradient></defs>'+g+'</svg>';
}

function rankPaths(st){
  if(!st.interests) return {missing:['نتيجة اختبار الميول']};
  const missingSub=Object.keys(TERM).filter(k=>st.term[k]==null);
  const top=Object.keys(st.interests).sort((a,b)=>st.interests[b]-st.interests[a]).filter(k=>st.interests[k]>=4).slice(0,2);
  const r=curPaths().map(p=>{const iSup=p.dims.filter(d=>top.includes(d)); const aSup=p.subj.filter(s=>(st.term[s]||0)>=80); const gaps=p.subj.filter(s=>st.term[s]!=null&&st.term[s]<75);
    let cat=iSup.length&&aSup.length?['good','متوافق مع الميول والأداء']:iSup.length?['warn','ميل واضح ويحتاج دعمًا أكاديميًا']:aSup.length?['none','أداء قوي والميل غير ظاهر']:(V.school==='mas'?null:['none','خيار متاح']);
    return {p,iSup,aSup,gaps,cat,score:iSup.length+aSup.length};}).filter(x=>x.cat).sort((a,b)=>b.score-a.score||b.iSup.length-a.iSup.length);
  return {top,list:r.slice(0,3),missingSub};
}

async function coachAsk(sid,q){
  const {st,res,strong,need}=studentSummary(sid);
  (S.chats[sid]=S.chats[sid]||[]).push({w:'me',t:q}); render();
  const sum=Object.keys(res).map(k=>S.subjects[k].name+' '+fmt(res[k].c.v)+'/'+res[k].c.max).join('، ')||'ما في درجات منشورة بعد';
  const plan=S.plans.filter(p=>p.sid===sid&&p.status!=='done').map(p=>DAYS[p.day]+' '+p.time+': '+p.title).join(' | ');
  const r=await gem('coach',{q, history:(S.chats[sid]||[]).slice(-6), summary:sum+(need.length?'، وتتدربين على '+need.join(' و'):''), strong:strong[0]||'التزامج', next:S.upcoming[0]?S.upcoming[0].title+' '+S.upcoming[0].when:'ما في اختبارات مسجّلة قريبًا', plan, goal:st.goal});
  S.chats[sid].push({w:'bot',t:r.text});
  if(/عدّل|ضغط|تعب|فات/.test(q)){const today=new Date().getDay(); S.plans.filter(p=>p.sid===sid&&p.day===today&&p.status!=='done').slice(1).forEach(p=>{p.day=(today+1)%7;p.why='انتقلت من اليوم لتخفيف الضغط. '+p.why;});}
  render(); const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight;
}
async function parentSum(sid){
  const {need}=studentSummary(sid); const done=S.plans.filter(p=>p.sid===sid&&p.status==='done'); const pr=done.filter(p=>p.result!=null).slice(-1)[0];
  V['sum-'+sid]={live:false,text:'…'}; render();
  const r=await gem('parent',{done:done.length, need:need[0], practice:pr?pr.result+' من 5 في '+pr.title:null});
  V['sum-'+sid]=r; render();
}

function formItems(skill){
  return BANK[skill].map(it=>{
    if(it.a) return {q:'الترتيب الإلكتروني لـ '+it.q, choices:shuffle([it.a].concat(it.d)), correct:it.a};
    if(it.p) {const c='الدورة '+it.p+' · المجموعة '+it.g; const alt=it.g===1?2:it.g===2?1:it.g===18?17:it.g+1; return {q:'وين بيت '+it.q+'؟', choices:shuffle([c,'الدورة '+(it.p===2?3:it.p-1)+' · المجموعة '+it.g,'الدورة '+it.p+' · المجموعة '+alt,'الدورة '+(it.p+1)+' · المجموعة '+(it.g===1?2:it.g-1)]), correct:c};}
    if(it.seq){const c=it.seq.join(' ← '); const w1=it.seq.slice().reverse().join(' ← '); const w2=[it.seq[1],it.seq[0]].concat(it.seq.slice(2)).join(' ← '); const w3=it.seq.slice(0,-2).concat([it.seq[it.seq.length-1],it.seq[it.seq.length-2]]).join(' ← ');
      return {q:'أي ترتيب امتلاء صحيح؟', choices:shuffle([...new Set([c,w1,w2,w3])]), correct:c};}
    const pair=Math.max(0,it.n-it.b), c=pair+' مزدوج و'+(it.n-2*pair)+' منفرد';
    return {q:it.q+': كم فلك مزدوج وكم منفرد؟ (قاعدة هوند)', choices:shuffle([...new Set([c,(pair+1)+' مزدوج و'+Math.max(0,it.n-2*(pair+1))+' منفرد','0 مزدوج و'+it.n+' منفرد',Math.floor(it.n/2)+' مزدوج و'+(it.n%2)+' منفرد'])]), correct:c};
  });
}

function interestClick(a,b){
  if(a==='it-close'){closeInterest();return;}
  if(a==='it-back'){IT.i=Math.max(0,IT.i-1); IT.ans.pop(); renderInterest(); return;}
  if(a==='it-ans'){IT.ans[IT.i]=Number(b.dataset.v);
    if(IT.i<ITEMS.length-1){IT.i++; renderInterest(); return;}
    const sum={},cnt={}; ITEMS.forEach((x,i)=>{sum[x[0]]=(sum[x[0]]||0)+IT.ans[i]; cnt[x[0]]=(cnt[x[0]]||0)+1;});
    const r={}; Object.keys(sum).forEach(k=>r[k]=Math.round(sum[k]/cnt[k]));
    const st=stu(IT.sid); if(st) st.interests=r; live('saveInterests',IT.sid,r);
    IT.done=r; renderInterest();}
}

(function(){
  const c=document.getElementById('sky'); if(!c||!c.getContext) return; const x=c.getContext('2d');
  const still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr,stars=[],shoot=null,next=0,t0=performance.now();
  const planets=[{fx:.9,fy:.82,r:46,c1:'#7B5CFF',c2:'#2A1E6B',ring:true},{fx:.08,fy:.3,r:16,c1:'#FF8FA3',c2:'#5A2342'},{fx:.62,fy:.12,r:8,c1:'#7FD8FF',c2:'#1C4A66'}];
  function size(){dpr=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(W*H/5200); stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6.28,s:.6+Math.random()*1.8,h:Math.random()<.12?'#FFD98A':Math.random()<.2?'#A9C8FF':'#FFFFFF'}));}
  function planet(p,t){const px=p.fx*W, py=p.fy*H+Math.sin(t/4000+p.r)*4;
    const g=x.createRadialGradient(px-p.r*.35,py-p.r*.35,p.r*.1,px,py,p.r); g.addColorStop(0,p.c1); g.addColorStop(1,p.c2);
    x.globalAlpha=.9; x.fillStyle=g; x.beginPath(); x.arc(px,py,p.r,0,6.283); x.fill();
    if(p.ring){x.globalAlpha=.55; x.strokeStyle='#FFC857'; x.lineWidth=2; x.beginPath(); x.ellipse(px,py,p.r*1.8,p.r*.45,-.35,0,6.283); x.stroke();}
    x.globalAlpha=1;}
  function frame(now){const t=now-t0; x.clearRect(0,0,W,H);
    for(const s of stars){const a=still?.7:.35+.65*Math.abs(Math.sin(s.p+t/1000*s.s)); x.globalAlpha=a; x.fillStyle=s.h; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.283); x.fill();
      if(s.r>1.25&&a>.85){x.globalAlpha=a*.5; x.fillRect(s.x-4,s.y-.3,8,.6); x.fillRect(s.x-.3,s.y-4,.6,8);}}
    x.globalAlpha=1; planets.forEach(p=>planet(p,t));
    if(!still){
      if(!shoot&&t>next){const sx=Math.random()*W*.7+W*.2; shoot={x:sx,y:Math.random()*H*.35,vx:-(6+Math.random()*4),vy:3+Math.random()*2,l:0}; next=t+4500+Math.random()*5000;}
      if(shoot){shoot.x+=shoot.vx; shoot.y+=shoot.vy; shoot.l++;
        const gr=x.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*14,shoot.y-shoot.vy*14); gr.addColorStop(0,'rgba(255,255,255,.95)'); gr.addColorStop(1,'rgba(255,200,87,0)');
        x.strokeStyle=gr; x.lineWidth=2; x.beginPath(); x.moveTo(shoot.x,shoot.y); x.lineTo(shoot.x-shoot.vx*14,shoot.y-shoot.vy*14); x.stroke();
        if(shoot.l>70||shoot.x<-50||shoot.y>H+50) shoot=null;}
      requestAnimationFrame(frame);}
  }
  size(); addEventListener('resize',size); requestAnimationFrame(frame);
})();

const SECS=[{id:'10-4',name:'10/4',d:4,names:['شهد','فاطمة','روان','غلا','منيرة','العنود','حصة','بشاير']},
            {id:'10-5',name:'10/5',d:-7,names:['مريم','ضي','دلال','سلمى','ياسمين','عائشة','رهف','شيخة']}];
// العائلات (ولي أمر ممكن عنده أكثر من بنت بشعب مختلفة)
const FAMS=[{id:'f1',n:'عائلة قمر',kids:['s1','s1_104']},{id:'f2',n:'عائلة نورة',kids:['s2','s2_105']},{id:'f3',n:'ولي أمر سارة',kids:['s3']},
            {id:'f4',n:'عائلة ريم',kids:['s4','s4_104','s4_105']},{id:'f5',n:'ولي أمر هيا',kids:['s5']}];
const SKEYS=['indicators','plans','practice','nominations'];
const LVDOWN={m:'p',p:'h',h:'h',n:'n'}, LVUP={h:'p',p:'m',m:'m',n:'n'};
function expandSections(S){
  const base=S.students.slice(), all=base.slice(), A={indicators:S.indicators.slice(),plans:S.plans.slice(),practice:(S.practice||[]).slice(),nominations:(S.nominations||[]).slice()};
  SECS.forEach(sec=>{const tag=sec.id.replace('-','');
    base.forEach((b,i)=>{const nid=b.id+'_'+tag, nn=sec.names[i];
      const sw=x=>JSON.parse(JSON.stringify(x).split('"'+b.id+'"').join('"'+nid+'"').split(b.name).join(nn));
      const c=sw(b); c.cls=sec.id; c.name=nn; c.parent='ولي أمر '+nn;
      Object.keys(c.term||{}).forEach(k=>{c.term[k]=Math.max(45,Math.min(99,Math.round(c.term[k]+sec.d+(hash01(nid+k)-0.5)*10)));});
      c.abs=Math.max(0,Math.round(c.abs+(hash01(nid+'a')-0.5)*4+(sec.d<0?1:0))); c.hw=Math.max(0,Math.round(c.hw+(hash01(nid+'h')-0.4)*3));
      if(sec.d<0&&i===1) c.goal='أرفع معدلي فوق 90'; all.push(c);
      A.indicators.filter(x=>x.sid===b.id).forEach(x=>{const y=sw(x); const r=hash01(nid+x.skill+x.week+x.period); if(sec.d<0&&r<0.35) y.level=LVDOWN[y.level]; if(sec.d>0&&r<0.3) y.level=LVUP[y.level]; A.indicators.push(y);});
      A.plans.filter(x=>x.sid===b.id).forEach(x=>{const y=sw(x); y.id=x.id+'_'+tag; A.plans.push(y);});
      A.practice.filter(x=>x.sid===b.id).forEach(x=>{const y=sw(x); if(sec.d<0) y.score=Math.max(1,y.score-1); A.practice.push(y);});
      A.nominations.filter(x=>x.sid===b.id).forEach(x=>{if(hash01(nid+x.id)<0.6){const y=sw(x); y.id=x.id+'_'+tag; A.nominations.push(y);}});
      S.assessments.forEach(a=>{const g=a.grades[b.id]; if(!g) return; const v=g.v==null?null:Math.max(0,Math.min(a.max,Math.round((g.v+sec.d/10*a.max/10+(hash01(nid+a.id)-0.5)*2)*2)/2)); a.grades[nid]={v,s:g.s};});
    });});
  S.classes=[{id:'10-4',name:'10/4'},{id:'10-5',name:'10/5'},{id:'10-6',name:'10/6'}];
  S.ALL=Object.assign({students:all},A); S.cls=null; setCls(S,'10-6');
}
function setCls(S0,c){const S_=S0||S; if(S_.cls===c) return;
  if(S_.cls){const cur=new Set(S_.students.map(s=>s.id));
    S_.ALL.students=S_.ALL.students.filter(s=>!cur.has(s.id)).concat(S_.students);
    SKEYS.forEach(k=>{S_.ALL[k]=S_.ALL[k].filter(x=>!cur.has(x.sid)).concat(S_[k]||[]);});}
  S_.cls=c; const ids=new Set(S_.ALL.students.filter(s=>s.cls===c).map(s=>s.id));
  S_.students=S_.ALL.students.filter(s=>ids.has(s.id)); SKEYS.forEach(k=>{S_[k]=S_.ALL[k].filter(x=>ids.has(x.sid));});
}

const VTYPES=[

  {k:'assembly',i:'⏰',n:'الغياب عن طابور الصباح',lv:'mid'},
  {k:'line',i:'🚶‍♀️',n:'الوقوف في طابور صف غير الفصل المخصص للطالبة',lv:'low'},
  {k:'exit',i:'🎟️',n:'الخروج من الفصل بدون كرت خروج',lv:'high'},

];

const MON={name:'أ. هيا',classes:['10-4','10-5','10-6']};
let VIOL=null, VV={grade:'10',track:'sci',sec:1,sid:null}, MV={cls:null,sid:null,type:'uniform'};
function vtype(k){return VTYPES.find(t=>t.k===k)||VTYPES[VTYPES.length-1];}
function violSeed(){

    {id:'v1',sid:pick(2),k:'assembly',note:'',by:MON.name,t:'الأحد 7:30 ص',d:-6},

}

function violRow(v,showName){const t=vtype(v.k), st=anyStu(v.sid)||{name:v.sname||'—'};

// ===== بيانات تجريبية للحادي عشر والثاني عشر (أسماء وهمية) =====
const UPN=['ريم','لولوة','حصة','دلال','شهد','جود','مريم','غلا','فاطمة','نوف','العنود','بشاير','روان','هيا','سارة','لطيفة','منيرة','دانة','أسيل','رزان'];
const UPL=['العتيبي','المطيري','العنزي','الرشيدي','الشمري','الكندري','العجمي','الفضلي','الهاجري','السبيعي'];
function upClasses(g,tr){return [1,2,3].map(n=>({id:g+'-'+tr+'-'+n,name:g+'/'+(tr==='sci'?'علمي ':'أدبي ')+n}));}
function upStudents(cid){const out=[]; for(let i=0;i<8;i++){const h=hash01(cid+i), h2=hash01(cid+'x'+i);
  out.push({id:'u_'+cid+'_'+i,name:UPN[Math.floor(h*UPN.length)]+' '+UPL[Math.floor(h2*UPL.length)],cls:cid,up:true,
    avg:Math.round(62+hash01(cid+'a'+i)*36),abs:Math.round(hash01(cid+'b'+i)*7)});}
  return out;}

// ===== تقرير Gemini للوكيلة =====
function viceAI(st){
  const l=violOf(st.id); const hi=l.filter(v=>vtype(v.k).lv==='high').length;
  let avg,abs,t={level:null,ev:[]},al=[],strong=[],need=[];
  if(st.up){avg=st.avg;abs=st.abs;}
  else{avg=avgTerm(st);abs=st.abs;try{t=talent(st.id);}catch(e){} try{al=alerts().filter(a=>a.sid===st.id);}catch(e){}
    try{const s=studentSummary(st.id);strong=s.strong||[];need=s.need||[];}catch(e){}}
  const stat = (avg>=90&&l.length===0)?['good','🌟 فائقة'] : (l.length>=3||hi>=1||(avg!=null&&avg<70)||al.length>=2)?['crit','⚠️ تحتاج متابعة'] : ['none','✓ مستقرة'];
  const lines=[];
  lines.push('<b>الأكاديمي:</b> '+(avg==null?'ما في درجات بعد.':'معدلها '+avg+(avg>=90?' — متفوقة.':avg>=80?' — جيد جدًا.':avg>=70?' — مقبول، تحتاج دفعة.':' — منخفض، تحتاج خطة دعم.'))+
    (strong.length?' أتقنت: '+strong.slice(0,3).map(esc).join('، ')+'.':'')+(need.length?' تحتاج دعم في: '+need.slice(0,3).map(esc).join('، ')+'.':''));
  lines.push('<b>الحضور:</b> '+(abs||0)+' أيام غياب'+(abs>=5?' — عالي، يحتاج تواصل مع الأهل.':'.'));
  lines.push('<b>السلوك:</b> '+(l.length?l.length+' ملاحظة'+(hi?'، منها '+hi+' تحتاج تدخّل':'')+'. آخرها: '+esc(l[l.length-1].k==='other'&&l[l.length-1].txt?l[l.length-1].txt:vtype(l[l.length-1].k).n)+' ('+esc(l[l.length-1].t)+').':'ما عليها أي ملاحظة 🤍'));
  if(t.level) lines.push('<b>الموهبة:</b> '+(t.level==='cand'?'مرشّحة لفحص الموهبة — كوكبتها مضوية من أكثر من جهة.':'عندها مؤشرات واعدة بالكوكبة.'));
  if(al.length) lines.push('<b>تنبيهات المعلمات:</b> '+al.length+' تنبيه مبكر مفتوح.');
  const rec = stat[0]==='crit' ? (l.length>=3?'جلسة قصيرة مع الطالبة اليوم، وتواصل مع ولي الأمر، وتحويل لبوصلة إذا تكرر.':'متابعة أسبوعية مع معلماتها وخطة دعم بالمواد الضعيفة.')
    : stat[0]==='good' ? 'كلمة تشجيع، وترشيحها لنشاط أو مسابقة تناسب موهبتها.' : 'تكمل على نفس المسار، ومتابعة عادية.';
  return '<section class="panel aiv"><div class="panel-h"><h2>🤖 تقرير Gemini عن '+esc(st.name)+'</h2><span class="spacer"></span><span class="pill '+stat[0]+'">'+stat[1]+'</span></div>'+
    '<ul class="ailist">'+lines.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+
    '<div class="airec">💡 <b>اقتراح للوكيلة:</b> '+rec+'</div>'+
    '<p class="small muted" style="margin:8px 0 0">ملخص يكتبه Gemini من درجاتها وحضورها وملاحظات المشرفة والمعلمات. بيانات تجريبية.</p></section>';
}
function stuStat(st){const l=violOf(st.id); const avg=st.up?st.avg:avgTerm(st); const hi=l.some(v=>vtype(v.k).lv==='high');
  if(avg>=90&&!l.length) return ['good','🌟 فائقة']; if(l.length>=3||hi||(avg!=null&&avg<70)) return ['crit','⚠️ متابعة']; return ['none','✓'];}

    if(k==='grade'){VV.grade=v;VV.cls=null;VV.sid=null;} else if(k==='track'){VV.track=v;VV.cls=null;VV.sid=null;}

function tSubj(){return V.subj&&S.subjects[V.subj]?V.subj:'chem';}
function weekSeries(sid,subj){const W={},LVS={m:100,p:60,h:25};
  S.indicators.filter(i=>i.sid===sid&&i.subj===subj).forEach(i=>{(W[i.week]=W[i.week]||[]).push(LVS[i.level]||0);});
  return Object.keys(W).map(Number).sort((a,b)=>a-b).map(w=>({w,v:Math.round(W[w].reduce((a,b)=>a+b,0)/W[w].length)}));}
function classSeries(subj){const ids=S.students.map(x=>x.id),W={},LVS={m:100,p:60,h:25};
  S.indicators.filter(i=>i.subj===subj&&ids.includes(i.sid)).forEach(i=>{(W[i.week]=W[i.week]||[]).push(LVS[i.level]||0);});
  return Object.keys(W).map(Number).sort((a,b)=>a-b).map(w=>({w,v:Math.round(W[w].reduce((a,b)=>a+b,0)/W[w].length)}));}
function progressChart(sid){const subj=tSubj(), me=weekSeries(sid,subj), cl=classSeries(subj), q=scoredAssess(sid,subj,true);
  if(me.length<2&&q.length<2) return '<section class="panel" id="tprog"><h2>📈 تحسّنها</h2><div class="empty">البيانات للحين قليلة.</div></section>';
  const ws=[...new Set([...me.map(x=>x.w),...cl.map(x=>x.w),...q.map(x=>x.week)])].sort((a,b)=>a-b);
  const W=560,H=210,L=34,R=12,T=14,B=30, x=w=>L+(ws.length<2?0:(ws.indexOf(w)/(ws.length-1))*(W-L-R)), y=v=>T+(1-v/100)*(H-T-B);
  const line=(a,k)=>a.map((p,i)=>(i?'L':'M')+x(p.w).toFixed(1)+','+y(p[k]).toFixed(1)).join(' ');
  const grid=[0,25,50,75,100].map(v=>'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="rgba(255,255,255,.08)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" font-size="10" fill="currentColor" opacity=".55" text-anchor="end">'+v+'</text>').join('');
  const xl=ws.map(w=>'<text x="'+x(w)+'" y="'+(H-10)+'" font-size="10" fill="currentColor" opacity=".55" text-anchor="middle">أ'+w+'</text>').join('');
  const qq=q.map(z=>({w:z.week,v:Math.round(z.r*100)}));
  const first=me.length?me[0].v:null,last=me.length?me[me.length-1].v:null,d=first!=null?last-first:0;
  return '<section class="panel" id="tprog"><div class="panel-h"><h2>📈 تحسّنها بـ'+esc(S.subjects[subj].name)+'</h2><span class="spacer"></span><span class="pill '+(d>5?'good':d<-5?'crit':'none')+'">'+(d>5?'▲ تحسّن '+d+' نقطة':d<-5?'▼ تراجع '+(-d)+' نقطة':'ثابتة')+'</span></div>'+
   '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;direction:ltr" role="img" aria-label="منحنى تحسّن الطالبة">'+grid+xl+
   (cl.length>1?'<path d="'+line(cl,'v')+'" fill="none" stroke="#9aa3c7" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>':'')+
   (me.length>1?'<path d="'+line(me,'v')+'" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+me.map(p=>'<circle cx="'+x(p.w)+'" cy="'+y(p.v)+'" r="4" fill="#ffd166"><title>أسبوع '+p.w+': '+p.v+'%</title></circle>').join(''):'')+
   qq.map(p=>'<rect x="'+(x(p.w)-5)+'" y="'+(y(p.v)-5)+'" width="10" height="10" rx="2" fill="#7bdcb5"><title>اختبار قصير أسبوع '+p.w+': '+p.v+'%</title></rect>').join('')+'</svg>'+
   '<div class="row small muted" style="gap:14px"><span><b style="color:#ffd166">●</b> ملاحظات الإتقان بالحصة</span><span><b style="color:#7bdcb5">■</b> الاختبارات القصيرة</span><span><b style="color:#9aa3c7">- -</b> متوسط الشعبة</span></div></section>';}
function teacherSummary(sid){const {st,res,strong,need}=studentSummary(sid); const fn=st.name.split(' ')[0], subj=tSubj(), parts=[];
  const me=weekSeries(sid,subj); if(me.length>=2){const d=me[me.length-1].v-me[0].v; parts.push(d>5?fn+' <b>تتحسّن</b> بـ'+S.subjects[subj].name+' (من '+me[0].v+'% إلى '+me[me.length-1].v+'% بملاحظات الحصة).':d<-5?fn+' <b>تراجعت</b> بـ'+S.subjects[subj].name+' (من '+me[0].v+'% إلى '+me[me.length-1].v+'%)، تحتاج متابعة.':fn+' <b>ثابتة</b> بـ'+S.subjects[subj].name+' (حوالي '+me[me.length-1].v+'%).');}
  const r=res[subj]; if(r) parts.push('آخر قصير: <b>'+fmt(r.c.v)+' / '+r.c.max+'</b>'+(r.d>0.02?' ▲ أحسن من اللي قبله.':r.d<-0.02?' ▼ أقل من اللي قبله.':'.'));

  if(need.length) parts.push('أصعب شي عليها: <b>'+esc(need.slice(0,2).join('، '))+'</b>.');
  const tm=Object.keys(st.term||{}).sort((a,b)=>st.term[b]-st.term[a]); if(tm.length>2) parts.push('أقوى موادها '+TERM[tm[0]]+' ('+st.term[tm[0]]+')، وأضعفها '+TERM[tm[tm.length-1]]+' ('+st.term[tm[tm.length-1]]+').');
  const pr=(S.practice||[]).filter(p=>p.sid===sid&&p.game!=='تقييم ذاتي'); if(pr.length) parts.push('تدربت '+pr.length+' '+(pr.length<=10?'مرات':'مرة')+' بالألعاب 👍');
  if(st.abs>=3) parts.push('⚠️ غابت '+st.abs+' أيام.'); if(st.hw>=2) parts.push('⚠️ عليها '+st.hw+' واجبات ناقصة.');
  const t=talent(sid); if(t.level==='cand') parts.push('🌟 عندها مؤشرات موهبة تستاهل تنفحص.');
  if(st.interests){const top=Object.keys(st.interests).sort((a,b)=>st.interests[b]-st.interests[a])[0]; parts.push('ميولها الأعلى: '+DIMS[top]+'.');}
  return '<section class="panel" id="tsum"><h2>🧠 ملخص '+esc(fn)+'</h2><p style="line-height:1.9;margin:0">'+(parts.join(' ')||'للحين ما فيه بيانات كافية.')+'</p></section>';}

  if(a==='bslot'){BV.slot=v; render(); return;}

  if(a==='bgo'){const y=$('#bkWhy'); bkConfirm(BV.who,BV.day,BV.slot,BV.mode,y?y.value.trim():''); return;}
  if(a==='bquick'){bkConfirm('teacher',b.dataset.d,b.dataset.h,'f2f','متابعة التنبيه'); return;}
},true);
document.addEventListener('submit',e=>{if(e.target.dataset.cal!=='addf') return; e.preventDefault(); e.stopPropagation();
  const to=$('#caTo').value.split(':'), ev={id:'x'+Date.now(),t:$('#caT').value,subj:$('#caS').value||null,title:$('#caN').value.trim(),date:$('#caD').value,time:$('#caH').value||'08:00',to:{k:to[0],v:to[1]},note:$('#caX').value.trim()};
  if(!ev.title||!ev.date) return; CALX.push(ev); calSave(); CV.add=false; const d=new Date(ev.date+'T12:00:00'); CV.y=d.getFullYear(); CV.m=d.getMonth(); CV.day=ev.date; render();
  toast('📨 انرسل لـ '+calToLbl(ev)+'، ونزل بتقويمهم مع تذكير');},true);
