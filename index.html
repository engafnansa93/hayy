<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>المنصة التعليمية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* التخطيط: شريط علوي ثابت للأدوار، وتحته لوحة الدور في أعمدة تتكدّس على الجوال، وبطاقة جولة عائمة أسفل الشاشة */
:root{
  --bg:#FAF6F5; --surface:#FFFFFF; --sunk:#F3ECEA; --ink:#2A1B18; --muted:#6E5A56; --line:#EADCD9;
  --accent:#C64C39; --accent-ink:#8B3428; --accent-soft:#FFD7D2; --accent-mid:#FFAFA4;
  --good:#2F7D5B; --good-soft:#DDF0E6; --warn:#A8670F; --warn-soft:#FBEBCF; --crit:#A61E3A; --crit-soft:#F8D9DF;
  --none:#8C7D7A; --none-soft:#EEE7E5;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1312; --surface:#241A19; --sunk:#2D2120; --ink:#F5E9E6; --muted:#BFA9A4; --line:#3D2D2B;
  --accent:#FF8F7E; --accent-ink:#FFB3A8; --accent-soft:#4A2723; --accent-mid:#7A3B33;
  --good:#6BCB9C; --good-soft:#1E3A2D; --warn:#F0B95A; --warn-soft:#3D2E14; --crit:#FF8FA3; --crit-soft:#47202A;
  --none:#A8968F; --none-soft:#332826; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1A1312; --surface:#241A19; --sunk:#2D2120; --ink:#F5E9E6; --muted:#BFA9A4; --line:#3D2D2B;
  --accent:#FF8F7E; --accent-ink:#FFB3A8; --accent-soft:#4A2723; --accent-mid:#7A3B33;
  --good:#6BCB9C; --good-soft:#1E3A2D; --warn:#F0B95A; --warn-soft:#3D2E14; --crit:#FF8FA3; --crit-soft:#47202A;
  --none:#A8968F; --none-soft:#332826; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
#app{min-height:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* الشريط العلوي */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none}
.brand h1{font-size:1.1rem}
.brand .sub{font-size:.78rem;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.demo{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.live{background:var(--good-soft);color:var(--good);border-color:transparent}
.badge.ai{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.spacer{flex:1}
.roles{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%}
.roles button{border:0;background:none;padding:6px 14px;border-radius:999px;white-space:nowrap;color:var(--muted);font-weight:500}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#2A1B18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#2A1B18}}
.btn.ghost{border-color:transparent;background:none;color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}

/* الصفحة */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:stretch}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.lead h2{font-size:1.35rem}
.lead .flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.lead .flow b{color:var(--ink);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.panel-h h2{font-size:1.02rem}
.panel-h .spacer{flex:1}
.eyebrow{font-size:.75rem;letter-spacing:.02em;color:var(--accent-ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
select,input[type=number],input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);min-width:0}
textarea{width:100%;resize:vertical;min-height:70px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-weight:600;color:var(--muted);font-size:.78rem;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}

/* المؤشرات */
.lv{display:inline-flex;gap:4px;flex-wrap:nowrap}
.lv button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 9px;font-size:.8rem;white-space:nowrap}
.lv button.good:hover,.lv button.good[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.lv button.warn:hover,.lv button.warn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.lv button.crit:hover,.lv button.crit[aria-pressed="true"]{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.lv button.none:hover,.lv button.none[aria-pressed="true"]{background:var(--none-soft);border-color:var(--none);color:var(--none)}
.dots{display:inline-flex;gap:4px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}.dot.none{background:var(--none-soft);border:1px solid var(--none)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.none{background:var(--none-soft);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* التنبيهات */
.alert{border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.alert.crit{border-inline-start-color:var(--crit)}
.alert .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.alert ul{margin:0;padding-inline-start:18px;font-size:.85rem;color:var(--muted)}
.ai-out{background:var(--sunk);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.ai-out ol,.ai-out ul{margin:0;padding-inline-start:20px}
.ai-tag{font-size:.72rem;color:var(--accent-ink);font-weight:600;display:flex;align-items:center;gap:6px}

/* خطة الطالبة */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:none;margin-top:2px;display:grid;place-items:center;padding:0}
.task.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{font-weight:600}
.t-why{font-size:.83rem;color:var(--muted)}
.t-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.t-act{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cal{font-size:.8rem;color:var(--accent-ink);text-decoration:none;border-bottom:1px dashed currentColor}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.88rem}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.trend.up{color:var(--good)}.trend.down{color:var(--crit)}.trend.flat{color:var(--muted)}

/* المحادثة */
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:.9rem;white-space:pre-wrap}
.msg.me{align-self:flex-start;background:var(--accent-soft);color:var(--ink)}
.msg.bot{align-self:flex-end;background:var(--sunk)}
.chat-in{display:flex;gap:8px}
.chat-in input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.8rem}

/* الإدارة */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:600}
.kpi span{font-size:.8rem;color:var(--muted)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk);min-width:120px}
.stack i{display:block;height:100%}
.stack .good{background:var(--good)}.stack .warn{background:var(--warn)}.stack .crit{background:var(--crit)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* المسارات */
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.path{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.path h3{font-size:.98rem}
.path dl{margin:0;display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.path dt{color:var(--muted);font-size:.75rem}
.path dd{margin:0}
.dim{display:grid;grid-template-columns:7.5em 1fr;gap:8px;align-items:center;font-size:.85rem}
.pips{display:flex;gap:3px}
.pips i{width:18px;height:8px;border-radius:3px;background:var(--sunk)}
.pips i.on{background:var(--accent)}
.note{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.84rem;color:var(--muted)}
.method{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:.84rem}
.method ol{margin:6px 0 0;padding-inline-start:20px}

/* الجولة */
.tour{position:fixed;z-index:40;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:max(16px,env(safe-area-inset-left,0px));max-width:560px;margin-inline:auto;background:var(--surface);border:1px solid var(--accent-mid);border-radius:14px;box-shadow:0 10px 30px rgba(60,20,15,.18);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tour .step{font-size:.75rem;color:var(--accent-ink);font-weight:600}
.tour h3{font-size:1rem}
.tour p{font-size:.9rem;color:var(--muted)}
.tour .row{justify-content:space-between}
.spot{outline:3px solid var(--accent);outline-offset:4px;border-radius:10px;transition:outline-color .3s}
.toast{position:fixed;z-index:50;top:calc(70px + env(safe-area-inset-top,0px));inset-inline:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.88rem}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:.88rem;border:1px dashed var(--line);border-radius:8px}
hr{border:0;border-top:1px solid var(--line);margin:0}

/* واجهة الطالبة — ألطف */
.kid{--k-bg1:#FFE9E5;--k-bg2:#FFF4E8;--k-card:#FFFFFF;--k-ring:#FBE1DC;--k-t1:#FFE7E2;--k-t2:#E7F3FF;--k-t3:#F1EAFF;--k-t4:#E4F6EC;display:flex;flex-direction:column;gap:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kid{--k-bg1:#3A2220;--k-bg2:#2E2418;--k-card:#241A19;--k-ring:#3D2A28;--k-t1:#3A2421;--k-t2:#1E2B3A;--k-t3:#2A2238;--k-t4:#1C3127}}
:root[data-theme="dark"] .kid{--k-bg1:#3A2220;--k-bg2:#2E2418;--k-card:#241A19;--k-ring:#3D2A28;--k-t1:#3A2421;--k-t2:#1E2B3A;--k-t3:#2A2238;--k-t4:#1C3127}
.kid .kcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.k-hero{background:linear-gradient(135deg,var(--k-bg1),var(--k-bg2));border-radius:24px;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.k-av{width:64px;height:64px;border-radius:50%;background:var(--k-card);display:grid;place-items:center;font-size:2.1rem;box-shadow:0 4px 14px rgba(198,76,57,.15);flex:none}
.k-hi{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.k-hi h2{font-size:1.4rem}
.k-hi p{color:var(--muted)}
.k-stats{display:flex;gap:8px;flex-wrap:wrap}
.k-stats span{background:var(--k-card);border-radius:999px;padding:3px 12px;font-size:.88rem}
.ring{width:72px;height:72px;flex:none}
.k-pick{flex-basis:100%;display:flex;justify-content:flex-end}
.k-card{background:var(--k-card);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(139,52,40,.06);min-width:0}
.k-card.t3{background:var(--k-t3)}
.k-h{display:flex;align-items:center;gap:8px}
.k-h h3{font-size:1.05rem}
.k-sub{font-size:.8rem;color:var(--muted)}
.k-note{font-size:.8rem;color:var(--muted)}
.k-empty{text-align:center;padding:18px;color:var(--muted);background:var(--sunk);border-radius:16px}
.k-task{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:18px;background:var(--sunk)}
.k-task.done{opacity:.6}.k-task.done .k-tt{text-decoration:line-through}
.k-ic{width:44px;height:44px;border-radius:14px;background:var(--k-card);display:grid;place-items:center;font-size:1.4rem;flex:none}
.k-ic.sm{width:32px;height:32px;font-size:1rem;border-radius:10px;background:var(--sunk)}
.k-tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.k-tt{font-weight:600}
.k-tm{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.k-why{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-ta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.k-chk{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--accent-mid);background:var(--k-card);flex:none;font-weight:700;color:#fff;display:grid;place-items:center;padding:0}
.k-task.done .k-chk{background:var(--good);border-color:var(--good)}
.k-play{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;box-shadow:0 3px 0 var(--accent-ink)}
.k-play.sm{padding:5px 14px;font-size:.85rem}
.k-play:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-ink)}
:root[data-theme="dark"] .k-play{color:#2A1B18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k-play{color:#2A1B18}}
.k-link{font-size:.82rem;color:var(--accent-ink);text-decoration:none;background:var(--k-card);border-radius:999px;padding:4px 11px}
.k-btns{display:flex;gap:8px;flex-wrap:wrap}
.k-soft{border:0;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:8px 14px;font-weight:500}
.k-gcal{font-size:.82rem;color:var(--accent-ink);text-decoration:none}
.k-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.k-day{background:var(--sunk);border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.k-day.today{background:var(--accent-soft);outline:2px solid var(--accent-mid)}
.k-dn{font-size:.72rem;color:var(--muted);white-space:nowrap}
.k-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;font-size:.85rem}
.k-dots i{font-style:normal}.k-dots i.done{opacity:.35}.k-dots em{font-style:normal;opacity:.5}
.k-games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k-game{border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.k-game.t1{background:var(--k-t1)}.k-game.t2{background:var(--k-t2)}.k-game.t3{background:var(--k-t3)}.k-game.t4{background:var(--k-t4)}
.k-game.lock{filter:grayscale(.7);opacity:.6}
.k-gi{font-size:2rem;line-height:1.1}
.k-st{color:#E8A317;letter-spacing:2px}.k-st i{color:var(--line);font-style:normal}
.k-pg{font-size:.72rem;color:var(--muted)}
.k-tags{display:flex;flex-wrap:wrap;gap:6px}
.k-up{display:flex;align-items:center;gap:10px;font-size:.88rem}
.kid .chat{background:var(--sunk);border-radius:16px;padding:10px}
.kid .msg{border-radius:18px}
.kid .msg.bot{background:var(--k-card)}
.kid .chip{border:0;background:var(--sunk)}
.kid .chat-in input{border-radius:999px;padding:8px 14px}
@media (max-width:520px){.k-week{gap:3px}.k-dn{font-size:.62rem}.k-games{grid-template-columns:1fr 1fr}.ring{width:60px;height:60px}}
.k-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem}
.k-legend span{display:inline-flex;align-items:center;gap:4px}
.k-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.k-dots i{padding-bottom:1px}
/* الألعاب */

      if(filter && filter.subj && filter.subj!==subj) return;
      S.subjects[subj].skills.forEach(skill=>{
        const l=S.indicators.filter(i=>i.sid===st.id&&i.subj===subj&&i.skill===skill).sort((a,b)=>a.week-b.week||a.period-b.period).slice(-3);
        const bad=l.filter(i=>i.level==='p'||i.level==='h');
        if(bad.length>=2) out.push({key:st.id+'|'+subj+'|skill|'+skill, sid:st.id, subj, skill, sev:bad.some(i=>i.level==='h')?'crit':'warn',
          reason:'تكرار التعثّر في مهارة «'+skill+'»',
          ev:l.map(i=>'الأسبوع '+i.week+'، الحصة '+i.period+': '+LV[i.level].t),
          action:'خطة دعم قصيرة في '+skill+' ومتابعة في الحصة القادمة', owner:S.subjects[subj].teacher, review:'الأسبوع '+(S.week+1)});
      });
      const sc=scoredAssess(st.id,subj,true);
      if(sc.length>=2){const [p,c]=sc.slice(-2); if(c.r<p.r-0.15) out.push({key:st.id+'|'+subj+'|drop', sid:st.id, subj, sev:'warn',
        reason:'تراجع بين تقييمين متكافئين', ev:[p.title+': '+fmt(p.v)+' من '+p.max, c.title+': '+fmt(c.v)+' من '+c.max],
        action:'مراجعة نوع الأخطاء مع الطالبة وتحديد المهارة', owner:S.subjects[subj].teacher, review:'الأسبوع '+(S.week+1)});}
    });
    if(!filter || !filter.subj || filter.general){
      if(st.hw>=2) out.push({key:st.id+'|hw', sid:st.id, subj:null, sev:'warn', reason:'تكرار عدم تسليم الواجبات', ev:['عدد الواجبات غير المسلّمة هذا الفصل: '+st.hw], action:'تواصل مع ولي الأمر وتنظيم وقت الواجبات في خطة الكوتش', owner:'المعلمة + ولي الأمر', review:'الأسبوع '+(S.week+1)});
      if(st.abs>=3) out.push({key:st.id+'|abs', sid:st.id, subj:null, sev:'warn', reason:'غياب مسجّل قد يؤثر على متابعة الدروس', ev:['أيام الغياب المسجّلة رسميًا: '+st.abs], action:'تزويدها بملخص الدروس الفائتة وإحالة للمرشدة', owner:'المرشدة', review:'الأسبوع '+(S.week+1)});
    }
  });
  return out;
}
function notifyNewAlerts(before){
  if(S.mode!=='live') return;
  alerts().filter(a=>!before.has(a.key)).forEach(a=>call('notifyAlert',a).catch(()=>{}));
}

/* ============ Gemini (حي أو محاكاة) ============ */
async function gem(kind,payload){
  if(S.gemini==='live' && IS_GAS){
    try{ const r=await call('askGemini',kind,payload); if(r && r.ok) return {live:true, text:r.text}; }catch(e){}
  }
  return {live:false, text:simGem(kind,payload)};
}
function simGem(kind,p){
  if(kind==='plan'){
    return JSON.stringify([
      {title:'فيديو مراجعة قصير: '+p.skill, min:10, why:'آخر مؤشرين في «'+p.skill+'» أقل من الإتقان، والفيديو يرجّعها للأساس.'},
      {title:'خمسة أسئلة تدريب على '+p.skill, min:20, why:'نتأكد إن الفهم ثبت، والنتيجة ترجع للمعلمة.', kind:'practice'},
      {title:'سؤال المعلمة عن أصعب خطوة في الحصة القادمة', min:5, why:'إذا تكرر التعثّر، الشرح المباشر أسرع.', kind:'ask'}
    ]);
  }
  if(kind==='parent'){
    const d=p.done, need=p.need;
    return 'أنجزت ابنتكم '+d+' '+(d===1?'مهمة':'مهام')+' من خطتها هذا الأسبوع.'+(need?' ما زالت تحتاج دعمًا في «'+need+'»، وخُصّص لها تدريب قصير ضمن خطتها.':' أداؤها مستقر في المهارات الحالية.')+
      (p.practice?' نتيجة آخر تدريب: '+p.practice+'.':'')+' يمكنكم مساعدتها بتوفير وقت هادئ للدراسة وتشجيعها على سؤال المعلمة.';
  }
  if(kind==='admin'){
    return 'أكثر مهارة تكرر فيها التعثّر هذا الفصل: «'+p.topSkill+'» ('+p.topCount+' ملاحظات بحاجة تدريب أو مساعدة). يقترح التحليل حصة مراجعة مشتركة لهذه المهارة، ومتابعة '+p.alertCount+' طالبات لديهن تنبيه «تحتاج متابعة».';
  }
  if(kind==='coach'){
    const q=(p.q||'').trim();
    if(/اشرح|حل|ما فهمت|مافهمت|سؤال/.test(q)) return 'الشرح عند مساعد المادة 🤍 أنا أنظّم وقتج. حطيت لج «اسألي مساعد الكيمياء» ضمن خطة اليوم، وإذا ما وضح، اسألي المعلمة بالحصة.';
    if(/فات|ما خلصت|ماخلصت|تأخرت|ما قدرت/.test(q)) return 'عادي يصير 👍 نقلت المهام اللي فاتتج لباجر وقسمتها على وقتين قصيرين، بدون ما نكدّسها. شوفي خطتج.';
    if(/اختبار|قصير|امتحان/.test(q)) return 'عندج '+p.next+'. حطيت لج مراجعة 20 دقيقة قبلها بيومين، ومراجعة سريعة 10 دقايق الليلة اللي قبل. يناسبج الساعة 5؟';
    if(/تعب|ضغط|كثير/.test(q)) return 'خففنا خطة اليوم لمهمتين بس، والباقي توزع على الأسبوع. استراحة 10 دقايق بين كل مهمة.';
    return 'وضعج: '+p.summary+' أقوى شي عندج '+p.strong+'. تبين أرتب لج خطة الأسبوع؟';
  }
  if(kind==='talent'){
    const d=(p.domains||[]).join(' و')||'مجالها';
    return p.who==='student'?'خطتج لهالشهر 🌟 أسبوع ١: اختاري سؤال يحيّرج في '+d+' ودوّري عليه. أسبوع ٢: سوي تجربة أو تصميم صغير وصوّريه. أسبوع ٣: اعرضيه على معلمتج. أسبوع ٤: سجّلي بمسابقة أو نشاط بالمدرسة.':
      'نقترح لهالشهر: ساعة بالأسبوع لنشاط في '+d+' تختاره هي، وتشجيعها تعرض شغلها على المعلمة، والتواصل مع المرشدة عن خطوة الفحص الرسمي. الأهم: نمدح الجهد مو بس النتيجة.';
  }
  if(kind==='counsel'){
    return 'الميول البارزة: '+p.top+'. الأداء الأقوى في: '+p.strong+'. أنسب ثلاثة مسارات حسب القواعد المعلنة معروضة بالأسفل، وتحتاج مناقشة مع الطالبة وولي الأمر قبل تحديد الهدف.';
  }
  return '';
}

function addIndicator(sid,level){
  const before=new Set(alerts().map(a=>a.key));
  const rec={sid,subj:V.subj,skill:V.skill,level,week:V.week,period:V.period,by:S.subjects[V.subj].teacher};
  S.indicators=S.indicators.filter(i=>!(i.sid===sid&&i.subj===rec.subj&&i.skill===rec.skill&&i.week===rec.week&&i.period===rec.period));
  S.indicators.push(rec);
  live('saveIndicator',rec);
  notifyNewAlerts(before);
}
function setGrade(aid,sid,val,st){
  const a=S.assessments.find(x=>x.id===aid); const old=a.grades[sid]||{};
  const g={v:st==='ok'?(val===''||val==null?null:Number(val)):null, s:st};
  if(st==='ok' && g.v==null) g.s='ungraded';
  if(g.v!=null && (g.v<0||g.v>a.max)){toast('الدرجة لازم تكون بين 0 و '+a.max);return false;}
  a.grades[sid]=g;
  if(a.status!=='draft'){a.status='draft'; S.audit.unshift({t:nowStr(),who:S.subjects[a.subj].teacher,what:'رجعت «'+a.title+'» مسودة بسبب تعديل درجة'});}
  S.audit.unshift({t:nowStr(),who:S.subjects[a.subj].teacher,what:stu(sid).name+' — '+a.title+': '+(old.s==='ok'?fmt(old.v):GST[old.s]||'—')+' ← '+(g.s==='ok'?fmt(g.v):GST[g.s])});
  live('saveGrade',{aid,sid,v:g.v,s:g.s});
  return true;
}
function setAssessStatus(aid,status){
  const before=new Set(alerts().map(a=>a.key));
  const a=S.assessments.find(x=>x.id===aid); a.status=status;
  S.audit.unshift({t:nowStr(),who:S.subjects[a.subj].teacher,what:'«'+a.title+'» صارت '+AST[status].t});
  live('setAssessmentStatus',aid,status);
  notifyNewAlerts(before);
}
async function suggestPlan(key){
  const al=alerts().find(a=>a.key===key); if(!al) return;
  V.pending=V.pending||{}; V.pending[key]={loading:true}; render();
  const r=await gem('plan',{skill:al.skill||'المهارة', subject:al.subj?S.subjects[al.subj].name:'', evidence:al.ev, reason:al.reason});
  let tasks; try{tasks=JSON.parse(r.text.replace(/```json|```/g,''));}catch(e){tasks=JSON.parse(simGem('plan',{skill:al.skill||'المهارة'})); r.live=false;}
  V.pending[key]={tasks,live:r.live}; render();
}
function approvePlan(key){
  const al=alerts().find(a=>a.key===key)||{}; const p=V.pending[key]; if(!p) return;
  const today=new Date().getDay(); let n=Date.now();
  p.tasks.forEach((t,i)=>{
    const task={id:'t'+(n++),sid:al.sid,subj:al.subj||'chem',skill:t.kind==='practice'?al.skill:undefined,title:t.title,why:t.why,min:t.min||15,day:i===2?(today+1)%7:today,time:i===0?'16:00':'18:30',kind:t.kind||'study',status:'todo',result:null,src:'خطة دعم اعتمدتها المعلمة'};
    S.plans.push(task); live('addTask',task);
  });
  S.audit.unshift({t:nowStr(),who:S.subjects[al.subj||'chem'].teacher,what:'اعتمدت خطة دعم لـ '+stu(al.sid).name+' في '+(al.skill||al.reason)});
  (S.supports=S.supports||[]).push({sid:al.sid,subj:al.subj,skill:al.skill,week:S.week,status:'جارية'});
  delete V.pending[key]; toast('انضافت الخطة لتقويم '+stu(al.sid).name+' ولخطتها اليوم'); render();
}
function toggleTask(id,result){
  const t=S.plans.find(x=>x.id===id); if(!t) return;
  if(t.kind==='practice' && t.status!=='done' && result!=null){
    finishPractice({sid:t.sid,subj:t.subj,skill:taskSkill(t),game:'تقييم ذاتي',score:result,total:5,items:[],mistakes:[],sec:0,at:new Date().toISOString()},t.id); return;
  }
  if(t.status==='done'){t.status='todo';t.result=null;} else t.status='done';
  live('updateTask',{id,status:t.status,result:t.result});
}
function calLink(t){
  const d=new Date(); const diff=(t.day-d.getDay()+7)%7; d.setDate(d.getDate()+diff);
  const [hh,mm]=t.time.split(':').map(Number); d.setHours(hh,mm,0,0); const e=new Date(d.getTime()+t.min*60000);
  const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&details='+encodeURIComponent(t.why+'\n— من خطة الكوتش في '+CONFIG.appName)+'&dates='+f(d)+'/'+f(e)+'&ctz=Asia/Kuwait';
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function memOf(sid){const m={};(S.practice||[]).filter(p=>p.sid===sid).forEach(p=>(p.items||[]).forEach(it=>{const x=m[it.k]=m[it.k]||{w:0,r:0};it.ok?x.r++:x.w++;}));return m;}
function pickItems(sid,skill){
  const mem=memOf(sid), bank=BANK[skill];
  const weak=shuffle(bank.filter(i=>mem[i.k]&&mem[i.k].w>mem[i.k].r));
  const fresh=shuffle(bank.filter(i=>!mem[i.k]));
  const rest=shuffle(bank.filter(i=>mem[i.k]&&!(mem[i.k].w>mem[i.k].r)));
  let out=weak.concat(fresh,rest).slice(0,5).map(i=>({skill,it:i}));
  // مراجعة متباعدة: سؤال من مهارة سابقة غلطت فيها يرجع هنا
  const back=ORDER_SK.filter(s=>s!==skill).flatMap(s=>BANK[s].filter(i=>mem[i.k]&&mem[i.k].w>mem[i.k].r).map(i=>({skill:s,it:i,review:true})));
  if(back.length) out[4]=shuffle(back)[0];
  return out;
}
function skillStars(sid,skill){const b=Math.max(-1,...(S.practice||[]).filter(p=>p.sid===sid&&p.skill===skill&&p.game!=='تقييم ذاتي').map(p=>p.score));return b>=5?3:b>=4?2:b>=3?1:0;}
function totalStars(sid){return ORDER_SK.reduce((n,s)=>n+skillStars(sid,s),0);}
function taskSkill(t){return t.skill||(t.title.split('على ')[1]||'').trim();}

let G=null;
function openGame(sid,skill,taskId){
  if(!GAMES[skill]) return;
  G={sid,skill,taskId,items:pickItems(sid,skill),i:0,score:0,res:[],mist:[],start:Date.now(),fb:null,sel:[],box:null};
  prepQ(); renderGame();
}
function prepQ(){const q=G.items[G.i]; G.fb=null; G.sel=[]; G.opts=null;
  const ty=GAMES[q.skill].type;
  if(ty==='bubble') G.opts=shuffle([q.it.a].concat(q.it.d));
  if(ty==='order') G.opts=shuffle(q.it.seq);
  if(ty==='orbit') G.box=Array(q.it.b).fill(0);
  if(ty==='home'){const {p,g}=q.it; const alt=g===1?2:g===2?1:g===18?17:g+1; const c=[[p,g],[p===2?3:p-1,g],[p,alt],[p+1,g===1?2:g-1]]; G.opts=shuffle(c.map(x=>x.join('|')));}
}
function answer(ok,shown){
  const q=G.items[G.i]; G.res.push({k:q.it.k,ok}); if(ok) G.score++; else if(q.it.m) G.mist.push(q.it.m);
  G.fb={ok,why:q.it.why,shown}; renderGame();
}
function nextQ(){
  if(G.i<G.items.length-1){G.i++; prepQ(); renderGame(); return;}
  const before=totalStars(G.sid);
  const rec={sid:G.sid,subj:'chem',skill:G.skill,game:GAMES[G.skill].name,score:G.score,total:G.items.length,items:G.res,mistakes:G.mist,sec:Math.round((Date.now()-G.start)/1000),at:new Date().toISOString()};
  finishPractice(rec,G.taskId);
  G.done={stars:skillStars(G.sid,G.skill),gained:totalStars(G.sid)-before}; renderGame();
}

function buildingSVG(floors,max){
  max=max||6; const fw=120, fh=22, x0=40, base=170; let s='';
  for(let i=0;i<max;i++){const y=base-(i+1)*fh, on=i<floors;
    s+='<rect x="'+x0+'" y="'+y+'" width="'+fw+'" height="'+(fh-2)+'" rx="3" fill="'+(on?'var(--accent)':'none')+'" fill-opacity="'+(on?0.18+i*0.1:1)+'" stroke="'+(on?'var(--accent)':'var(--line)')+'" stroke-dasharray="'+(on?'0':'4 4')+'"/>';
    if(on) for(let w=0;w<4;w++) s+='<rect x="'+(x0+12+w*27)+'" y="'+(y+6)+'" width="14" height="8" rx="1.5" fill="var(--surface)"/>';}
  if(floors<max){const ty=base-max*fh-12; s+='<path d="M175 '+(base)+' V'+ty+' H70 M175 '+ty+' l-14 0 M95 '+ty+' v18" stroke="var(--warn)" stroke-width="2.5" fill="none"/><rect x="88" y="'+(ty+18)+'" width="14" height="8" fill="var(--warn)"/>';}
  return '<svg viewBox="0 0 200 180" role="img" aria-label="عمارة الإلكترونات: '+floors+' من '+max+' أدوار" style="width:100%;max-width:220px;height:auto"><line x1="20" y1="'+base+'" x2="190" y2="'+base+'" stroke="var(--muted)" stroke-width="2"/>'+s+'</svg>';
}

function gameClick(a,b){
  const q=G.items[G.i], it=q.it;
  if(a==='g-bub') answer(b.dataset.v===it.a, b.dataset.v===it.a?'':'الصحيح: '+it.a);
  else if(a==='g-ord'){G.sel.push(b.dataset.v); if(G.sel.length===it.seq.length){const ok=G.sel.every((x,i)=>x===it.seq[i]); answer(ok, ok?'':'الصحيح: '+it.seq.join(' ← '));} else renderGame();}
  else if(a==='g-ordreset'){G.sel=[]; renderGame();}
  else if(a==='g-orb'){const i=+b.dataset.i; G.box[i]=(G.box[i]+1)%3; renderGame();}
  else if(a==='g-check'){const tot=G.box.reduce((x,y)=>x+y,0), pairs=G.box.filter(v=>v===2).length, need=Math.max(0,it.n-it.b);
    const ok=tot===it.n && pairs===need; answer(ok, ok?'':(tot!==it.n?'العدد لازم يكون '+it.n:'الأفلاك المزدوجة لازم تكون '+need));}
  else if(a==='g-home'){const ok=b.dataset.v===it.p+'|'+it.g; answer(ok, ok?'':'الصحيح: الدورة '+it.p+' · المجموعة '+it.g);}
  else if(a==='g-next') nextQ();
  else if(a==='g-close') closeGame();
}

function talent(sid){
  const st=stu(sid); if(!st) return {score:0,level:null,dom:[],ev:[]};

  const tv=Object.values(st.term||{}).filter(v=>v!=null);
  if(tv.length>=4){const avg=tv.reduce((a,b)=>a+b,0)/tv.length; if(avg>=90) add('acad','معدل عالي ('+fmt(avg)+')',1);}
  Object.keys(st.term||{}).forEach(k=>{if(st.term[k]>=95) add(TAL_SUBJ[k]||'acad',TERM[k]+' '+st.term[k],1);});
  const pr=(S.practice||[]).filter(p=>p.sid===sid&&p.game!=='تقييم ذاتي'), full=pr.filter(p=>p.score===p.total);
  if(full.length>=2){const sec=Math.round(full.reduce((a,p)=>a+(p.sec||0),0)/full.length); if(sec&&sec<=240) add('sci','دقة وسرعة بالتدريب ('+full.length+' ألعاب كاملة، متوسط '+Math.round(sec/60*10)/10+' د)',1);}
  if(st.interests) Object.keys(st.interests).forEach(k=>{if(st.interests[k]>=5&&TAL_DIM[k]) add(TAL_DIM[k],'ميل قوي: '+DIMS[k],0.5);});
  if(/أولمبياد|مسابقة/.test(st.goal||'')) add('sci','هدفها: '+st.goal,0.5);
  noms(sid).forEach(n=>{if(n.role==='teacher') add(n.domain,'ترشيح '+n.by+(n.traits&&n.traits.length?': '+n.traits.join('، '):''),1.5);
    else if(n.role==='parent') add(n.domain,'ترشيح ولي الأمر: '+(n.note||TAL[n.domain].n),1);});
  const score=ev.reduce((a,e)=>a+e.w,0), dm={}; ev.forEach(e=>dm[e.d]=(dm[e.d]||0)+e.w);
  const dom=Object.keys(dm).sort((a,b)=>dm[b]-dm[a]).filter(d=>d!=='acad'||Object.keys(dm).length===1).slice(0,2);
  const referred=noms(sid).some(n=>n.status==='referred');
  return {score,level:score>=3?'cand':score>=2?'prom':null,dom,ev,referred};
}

/* ---- المرشدة ---- */
function rankPaths(st){
  if(!st.interests) return {missing:['نتيجة اختبار الميول']};
  const missingSub=Object.keys(TERM).filter(k=>st.term[k]==null);
  const top=Object.keys(st.interests).sort((a,b)=>st.interests[b]-st.interests[a]).filter(k=>st.interests[k]>=4).slice(0,2);
  const r=PATHS.map(p=>{const iSup=p.dims.filter(d=>top.includes(d)); const aSup=p.subj.filter(s=>(st.term[s]||0)>=80); const gaps=p.subj.filter(s=>st.term[s]!=null&&st.term[s]<75);
    let cat=iSup.length&&aSup.length?['good','متوافق مع الميول والأداء']:iSup.length?['warn','ميل واضح ويحتاج دعمًا أكاديميًا']:aSup.length?['none','أداء قوي والميل غير ظاهر']:null;
    return {p,iSup,aSup,gaps,cat,score:iSup.length+aSup.length};}).filter(x=>x.cat).sort((a,b)=>b.score-a.score||b.iSup.length-a.iSup.length);
  return {top,list:r.slice(0,3),missingSub};
}

async function coachAsk(sid,q){
  const {st,res,strong,need}=studentSummary(sid);
  (S.chats[sid]=S.chats[sid]||[]).push({w:'me',t:q}); render();
  const sum=Object.keys(res).map(k=>S.subjects[k].name+' '+fmt(res[k].c.v)+'/'+res[k].c.max).join('، ')||'ما في درجات منشورة بعد';
  const plan=S.plans.filter(p=>p.sid===sid&&p.status!=='done').map(p=>DAYS[p.day]+' '+p.time+': '+p.title).join(' | ');
  const r=await gem('coach',{q, history:(S.chats[sid]||[]).slice(-6), summary:sum+(need.length?'، وتتدربين على '+need.join(' و'):''), strong:strong[0]||'التزامج', next:S.upcoming[0]?S.upcoming[0].title+' '+S.upcoming[0].when:'ما في اختبارات مسجّلة قريبًا', plan, goal:st.goal});
  S.chats[sid].push({w:'bot',t:r.text});
  if(/عدّل|ضغط|تعب|فات/.test(q)){const today=new Date().getDay(); S.plans.filter(p=>p.sid===sid&&p.day===today&&p.status!=='done').slice(1).forEach(p=>{p.day=(today+1)%7;p.why='انتقلت من اليوم لتخفيف الضغط. '+p.why;});}
  render(); const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight;
}
async function parentSum(sid){
  const {need}=studentSummary(sid); const done=S.plans.filter(p=>p.sid===sid&&p.status==='done'); const pr=done.filter(p=>p.result!=null).slice(-1)[0];
  V['sum-'+sid]={live:false,text:'…'}; render();
  const r=await gem('parent',{done:done.length, need:need[0], practice:pr?pr.result+' من 5 في '+pr.title:null});
  V['sum-'+sid]=r; render();
}

function formItems(skill){
  return BANK[skill].map(it=>{
    if(it.a) return {q:'الترتيب الإلكتروني لـ '+it.q, choices:shuffle([it.a].concat(it.d)), correct:it.a};
    if(it.p) {const c='الدورة '+it.p+' · المجموعة '+it.g; const alt=it.g===1?2:it.g===2?1:it.g===18?17:it.g+1; return {q:'وين بيت '+it.q+'؟', choices:shuffle([c,'الدورة '+(it.p===2?3:it.p-1)+' · المجموعة '+it.g,'الدورة '+it.p+' · المجموعة '+alt,'الدورة '+(it.p+1)+' · المجموعة '+(it.g===1?2:it.g-1)]), correct:c};}
    if(it.seq){const c=it.seq.join(' ← '); const w1=it.seq.slice().reverse().join(' ← '); const w2=[it.seq[1],it.seq[0]].concat(it.seq.slice(2)).join(' ← '); const w3=it.seq.slice(0,-2).concat([it.seq[it.seq.length-1],it.seq[it.seq.length-2]]).join(' ← ');
      return {q:'أي ترتيب امتلاء صحيح؟', choices:shuffle([...new Set([c,w1,w2,w3])]), correct:c};}
    const pair=Math.max(0,it.n-it.b), c=pair+' مزدوج و'+(it.n-2*pair)+' منفرد';
    return {q:it.q+': كم فلك مزدوج وكم منفرد؟ (قاعدة هوند)', choices:shuffle([...new Set([c,(pair+1)+' مزدوج و'+Math.max(0,it.n-2*(pair+1))+' منفرد','0 مزدوج و'+it.n+' منفرد',Math.floor(it.n/2)+' مزدوج و'+(it.n%2)+' منفرد'])]), correct:c};
  });
}

let IT=null;
function openInterest(sid){IT={sid,i:0,ans:[]}; $('#game').hidden=false; document.body.style.overflow='hidden'; renderInterest();}
function closeInterest(){IT=null; $('#game').hidden=true; document.body.style.overflow=''; render();}
function renderInterest(){
  const el=$('#game');

    '<p class="g-q"><b>'+esc(it[1])+'</b></p>'+
    '<div class="g-opts" style="grid-template-columns:repeat(5,1fr)">'+FACES.map((f,n)=>'<button class="btn" data-act="it-ans" data-v="'+(n+1)+'" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px"><span style="font-size:1.8rem">'+f[0]+'</span><span class="small">'+f[1]+'</span></button>').join('')+'</div>'+

function interestClick(a,b){
  if(a==='it-close'){closeInterest();return;}
  if(a==='it-back'){IT.i=Math.max(0,IT.i-1); IT.ans.pop(); renderInterest(); return;}
  if(a==='it-ans'){IT.ans[IT.i]=Number(b.dataset.v);
    if(IT.i<ITEMS.length-1){IT.i++; renderInterest(); return;}
    const sum={},cnt={}; ITEMS.forEach((x,i)=>{sum[x[0]]=(sum[x[0]]||0)+IT.ans[i]; cnt[x[0]]=(cnt[x[0]]||0)+1;});
    const r={}; Object.keys(sum).forEach(k=>r[k]=Math.round(sum[k]/cnt[k]));
    const st=stu(IT.sid); if(st) st.interests=r; live('saveInterests',IT.sid,r);
    IT.done=r; renderInterest();}
}

/* ============ ربط الأحداث ============ */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b || b.tagName==='SELECT' || b.tagName==='FORM' || b.tagName==='INPUT') return;
  const a=b.dataset.act;
  if(G && a.startsWith('g-')){gameClick(a,b);return;}
  if(IT && a.startsWith('it-')){interestClick(a,b);return;}
  if(a==='itest'){openInterest(S.mode==='live'&&V.role==='student'?S.me.self:V.sid);return;}
  if(a==='play'){openGame(S.mode==='live'&&V.role==='student'?S.me.self:V.sid,b.dataset.skill,b.dataset.id||null);return;}
  if(a==='gform'||a==='gclass'||a==='gcal'){gtool(a);return;}
  if(a==='role'){V.role=b.dataset.v; V.gout=null; render(); window.scrollTo(0,0);}
  else if(a==='ind'){addIndicator(b.dataset.sid,b.dataset.v); render();}
  else if(a==='astatus'){setAssessStatus(V.assess,b.dataset.v); render(); toast(b.dataset.v==='published'?'نُشرت الدرجات للطالبات وأولياء الأمور':'اعتُمدت الدرجات');}
  else if(a==='suggest'){suggestPlan(b.dataset.k);}
  else if(a==='approve'){approvePlan(b.dataset.k);}
  else if(a==='discard'){delete V.pending[b.dataset.k]; render();}
  else if(a==='task'){const t=S.plans.find(x=>x.id===b.dataset.id); if(t.kind==='practice'&&t.status!=='done'&&GAMES[taskSkill(t)]){openGame(t.sid,taskSkill(t),t.id);return;} if(t.kind==='practice'&&t.status!=='done'){const s=$('#pres-'+t.id); if(!s||s.value===''){toast('اختاري نتيجتج من 5 أول'); s&&s.focus(); return;} toggleTask(t.id,Number(s.value));} else toggleTask(t.id); render();}
  else if(a==='help'){const sid=S.mode==='live'&&V.role==='student'?S.me.self:V.sid; S.requests.unshift({sid,text:'طلبت مساعدة من صفحة خطتها',t:nowStr()}); live('helpRequest',sid); toast('وصل طلبج للمعلمة والمرشدة');}
  else if(a==='coachq'){coachAsk(S.mode==='live'&&V.role==='student'?S.me.self:V.sid,b.dataset.q);}
  else if(a==='psum'){parentSum(b.dataset.sid);}
  else if(a==='psend'){live('sendParentSummary',b.dataset.sid,V['sum-'+b.dataset.sid].text).then(()=>toast('أُرسل الملخص'));}
  else if(a==='csum'){const st=stu(V.sid);const R=rankPaths(st);const r=await gem('counsel',{top:(R.top||[]).map(d=>DIMS[d]).join(' و'),strong:Object.keys(st.term).sort((x,y)=>st.term[y]-st.term[x]).slice(0,2).map(k=>TERM[k]).join(' و'),paths:(R.list||[]).map(x=>x.p.name)});V['cs-'+st.id]=r;render();}
  else if(a==='nomT'){const sid=$('#nmSid').value, tr=[...document.querySelectorAll('.nmTr:checked')].map(x=>x.value);
    saveNom({id:'n'+Date.now(),sid,role:'teacher',by:S.me.roles.includes('teacher')&&S.mode==='live'?S.me.name:'المعلمة',domain:$('#nmDom').value,traits:tr,note:$('#nmNote').value.trim(),status:'new',at:new Date().toISOString()});
    toast('وصل ترشيح '+stu(sid).name+' للمرشدة'); render();}
  else if(a==='nomP'){const sid=b.dataset.sid;
    saveNom({id:'n'+Date.now(),sid,role:'parent',by:S.mode==='live'?S.me.name:stu(sid).parent,domain:$('#pnDom').value,traits:[],note:$('#pnNote').value.trim(),status:'new',at:new Date().toISOString()});
    toast('شكرًا 🤍 وصلت للمرشدة'); render();}
  else if(a==='refer'){const sid=b.dataset.sid, t=talent(sid);
    saveNom({id:'n'+Date.now(),sid,role:'counselor',by:S.mode==='live'?S.me.name:'المرشدة',domain:t.dom[0]||'acad',traits:[],note:'تحويل للفحص الرسمي',status:'referred',at:new Date().toISOString()});
    S.audit.unshift({t:nowStr(),who:'المرشدة',what:'حوّلت '+stu(sid).name+' لفحص الموهبة'}); toast('انحوّلت '+stu(sid).name+' للفحص، وبيوصل لولي الأمر'); render();}
  else if(a==='talg'){const sid=b.dataset.sid, t=talent(sid); const k='tal-'+sid+'-'+V.role; V[k]={live:false,text:'⏳ لحظة…'}; render();
    gem('talent',{name:stu(sid).name, domains:t.dom.map(d=>TAL[d].n), evidence:t.ev.map(e=>e.t), who:V.role}).then(r=>{V[k]=r; render();});}
  else if(a==='review'){S.reviews[V.sid]=Object.assign(S.reviews[V.sid]||{},{note:$('#rvNote').value,at:nowStr()}); live('saveReview',V.sid,S.reviews[V.sid]); render(); toast('حُفظت المراجعة');}
  else if(a==='goal'){const p=PATHS.find(x=>x.id===b.dataset.v); const st=stu(V.sid); S.reviews[V.sid]=Object.assign(S.reviews[V.sid]||{},{goal:p.id}); st.goal='الاستعداد لمسار '+p.name;
    const gaps=rankPaths(st).list.find(x=>x.p.id===p.id).gaps; const today=new Date().getDay();
    [{title:'نشاط استكشافي: '+p.explore,min:45,why:'تجربة عملية تساعدج تتأكدين من اختيار مسار '+p.name+'.'}].concat(gaps.map(g=>({title:'حصة تقوية قصيرة في '+TERM[g],min:25,why:'مادة أساسية لمسار '+p.name+' ودرجتج فيها تحتاج رفع.'}))).forEach((t,i)=>{const nt={id:'t'+Date.now()+i,sid:st.id,subj:p.subj[0],title:t.title,why:t.why,min:t.min,day:(today+2+i)%7,time:'17:00',kind:'path',status:'todo',result:null,src:'الكوتش — هدف المسار'};S.plans.push(nt);live('addTask',nt);});
    live('saveReview',V.sid,S.reviews[V.sid]); render(); toast('حدّث الكوتش خطة '+st.name+' لهدف المسار');}
  else if(a==='tour-start'){T.on=true; STEPS.forEach(s=>{s.ran=false; if(s.stay) s.btn='العبي التدريب';}); goStep(0);}
  else if(a==='tour-next'){b.disabled=true; await tourNext();}
  else if(a==='tour-back'){goStep(Math.max(0,T.i-1));}
  else if(a==='tour-end'){T.on=false; $('#tour').hidden=true; document.querySelectorAll('.spot').forEach(e=>e.classList.remove('spot'));}
});
document.addEventListener('change',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='subj'){V.subj=b.value; V.assess=null; render();}
  else if(a==='skill'){V.skill=b.value; render();}
  else if(a==='week'){V.week=Number(b.value); render();}
  else if(a==='period'){V.period=Number(b.value); render();}
  else if(a==='assess'){V.assess=b.value; render();}
  else if(a==='sid'){V.sid=b.value; render();}
  else if(a==='digest'){const st=stu(b.dataset.sid); st.digest=b.value; live('setDigest',st.id,b.value); toast(b.value==='daily'?'بيوصلكم التقرير آخر كل يوم':'بيوصلكم التقرير كل خميس');}
  else if(a==='gst'){const v=$('#g-'+V.assess+'-'+b.dataset.sid).value; if(setGrade(V.assess,b.dataset.sid,v,b.value)) render();}
  else if(a==='gval'){const s=$('#gs-'+V.assess+'-'+b.dataset.sid); if(!setGrade(V.assess,b.dataset.sid,b.value,'ok')) b.value=''; render();}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-act]'); if(!f) return; e.preventDefault();
  if(f.dataset.act==='coachf'){const i=$('#coachIn'); const q=i.value.trim(); if(q) coachAsk(S.mode==='live'&&V.role==='student'?S.me.self:V.sid,q);}
  if(f.dataset.act==='newa'){const a={id:'a'+Date.now(),subj:V.subj,cls:(S.students[0]||{}).cls||'',title:$('#naT').value.trim(),max:Number($('#naM').value)||10,skill:$('#naS').value,week:Number($('#naW').value)||V.week,status:'draft',grades:{}};
    if(!a.title) return; S.assessments.push(a); V.assess=a.id; live('createAssessment',{id:a.id,subj:a.subj,cls:a.cls,title:a.title,max:a.max,skill:a.skill,week:a.week}); render(); toast('أُنشئ التقييم كمسودة');}
  if(f.dataset.act==='askf'){const q=$('#askIn').value.trim(); const al=alerts(); const rows=Object.keys(S.subjects).flatMap(k=>S.subjects[k].skills.map(sk=>({sk,bad:S.indicators.filter(i=>i.subj===k&&i.skill===sk&&(i.level==='p'||i.level==='h')).length}))).sort((a,b)=>b.bad-a.bad);
    V.adminAns={live:false,text:'…'}; render();
    gem('admin',{q, topSkill:rows[0]?rows[0].sk:'—', topCount:rows[0]?rows[0].bad:0, alertCount:new Set(al.map(a=>a.sid)).size, skills:rows.slice(0,6)}).then(r=>{V.adminAns=r; render();});}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&G) closeGame(); else if(e.key==='Escape'&&IT) closeInterest();});
/* ============ التشغيل ============ */
function boot(){
  document.documentElement.lang='ar'; document.documentElement.dir='rtl';
  if(IS_GAS){
    S=demoState(); render();
    call('getBootstrap').then(d=>{
      if(d.config) Object.assign(CONFIG,d.config,{links:Object.assign(CONFIG.links,d.config.links||{})});
      if(d.mode==='live'){ S=d.state; S.mode='live'; S.chats=S.chats||{}; S.reviews=S.reviews||{}; S.requests=S.requests||[]; S.audit=S.audit||[]; S.practice=S.practice||[];
        V.role=S.me.roles[0]; V.sid=S.me.self||(S.students[0]&&S.students[0].id); V.subj=Object.keys(S.subjects)[0]; V.assess=null; V.week=S.week||1; }
      S.gemini=d.gemini?'live':'sim'; render();
      try{ google.script.url.getLocation(loc=>{const sk=loc.parameter&&loc.parameter.play; if(sk&&GAMES[sk]){ if(S.me.roles.includes('student')) V.role='student'; render(); openGame(S.me.self||V.sid,sk,null);} }); }catch(e){}
    }).catch(e=>{console.error("boot",e);});
  } else { S=demoState(); render(); }
}
boot();
</script>
